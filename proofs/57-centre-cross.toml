# Proof manifest -- schema in proofs/README.md.
# Run: python scripts/prove.py 57-centre-cross
issues = [57]
summary = """F57: both collimation-tool camera screens (CameraPanel's LiveViewLabel) now show a pure-green \
cross through the centre of the displayed image -- full-length horizontal and vertical lines, exactly 2 \
screen px thick at any widget size and aspect ratio. It is drawn with whole-pixel fillRect on the scaled \
pixmap in LiveViewLabel._update_scaled_pixmap (a 2 px line in the native 3840x2160 frame would shrink \
below 1 px when shown), never on _base_pixmap, so analysed frames, FITS, the existing overlays and the \
diagnostic display snapshot (CameraPanel.displayed_image_png reads _base_pixmap) are unchanged. Review \
hardening: a null pixmap is skipped (no QPainter warnings); the tests cover an odd displayed width, an \
RGB frame and the rows/columns next to the cross."""
modules = [
    "apps/collimation_tool/ui/live_view.py",
]
fix_commits = ["0db0b72"]
dataset_uuids = []
focused_command = "pytest -q tests/collimation/ui/test_live_view.py::TestCentreCross"
broader_tier = "component"
field_only_assumptions = [
    "On the Pi screen (device pixel ratio 1) a 2 px pixmap line is 2 physical px; on a scaled desktop display (DPR > 1) Qt upscales the whole label pixmap, so the lines are 2 logical px (2 x DPR physical).",
]

