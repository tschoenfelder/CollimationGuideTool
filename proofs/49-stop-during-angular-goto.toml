# Proof manifest -- schema in proofs/README.md.
# Run: python scripts/prove.py 49-stop-during-angular-goto
issues = [49, 44]
summary = """S6.0c: OnStepAdapter 0.4.1's move_*_axis_deg blocks for the whole GOTO with no cancel \
hook, and OnStepMountPulseAdapter.move_angular holds operation_lock for all of it (9cea2e9). Stop took \
the same lock on the GUI thread, GUI status polls (pulse, park, home, focuser) queued behind every GOTO \
(the Mount Align nudge click itself froze), and _cancel was never checked. Fix: Stop is the deliberate \
exception to serialization -- lock-free abort(), latched cancel checked atomically before sending, \
OnStep's emergency stop from one worker whose follow-up stop covers only GOTOs issued up to that Stop; \
GUI reads never queue (try_operation; held-over or 'not known' readings, cleared on disconnect); the \
runner sends no further step. #44 safety: display may use held-over readings but no decision does -- \
MountParkStatus.fresh; ensure_tracking_mode/TrackingEnforcer answer BUSY and fail CLOSED with an \
actionable reason, never 'verified'; 'no mount configured' keeps today's allow; off the GUI thread a \
decision waits up to WORKER_DECISION_FRESH_WAIT_S for a fresh reading; GUI gates never wait."""
modules = [
    "packages/astrotool_core/onstep/mount_pulse_adapter.py",
    "packages/astrotool_core/onstep/connection.py",
    "packages/astrotool_core/onstep/mount_park_adapter.py",
    "packages/astrotool_core/onstep/focuser_adapter.py",
    "packages/astrotool_core/mount/park_port.py",
    "packages/astrotool_core/mount/tracking_mode.py",
    "packages/astrotool_core/mount/operating_mode.py",
    "packages/astrotool_core/mount/__init__.py",
    "apps/collimation_tool/ui/mount_test_move_runner.py",
    "apps/collimation_tool/ui/mount_test_move_panel.py",
    "apps/collimation_tool/ui/mount_park_panel.py",
]
fix_commits = ["52fd72f"]
dataset_uuids = []
focused_command = "pytest -q tests/core/onstep/test_onstep_adapters.py::TestStopDuringAngularGoto tests/core/onstep/test_onstep_adapters.py::TestReadsDuringAGotoDoNotQueue tests/core/onstep/test_onstep_adapters.py::TestStopWorkerSafety tests/core/onstep/test_onstep_adapters.py::TestOperationSerialization tests/core/onstep/test_onstep_simulator.py::TestAxisMoves tests/core/mount/test_operating_mode.py::TestDecisionsNeverUseHeldOverReadings tests/collimation/ui/test_mount_align_real_onstep_adapter.py::TestStopDuringABlockingAngularGoto tests/collimation/ui/test_mount_align_real_onstep_adapter.py::TestTrackingDecisionsWhileTheMountIsBusy tests/collimation/ui/test_mount_align_real_onstep_adapter.py::TestWorkerDecisionsWaitBrieflyForAFreshReading tests/collimation/ui/test_mount_align_real_onstep_adapter.py::TestBusyIsShownAsBusy"
broader_tier = "component"
field_only_assumptions = [
    "The real OnStep/lx200_OnStep honours INDI TELESCOPE_ABORT_MOTION during a finite axis GOTO (stops short at once) -- OnStepAdapter claims it (indi_stop.py:29); the simulator models it.",
    "After Stop the interrupted OnStepAdapter call still ends only at its own deadline (30 s) plus up to 5 s of stop confirmation (no cancel hook); Mount Align controls stay disabled for that time.",
    "TELESCOPE_ABORT_MOTION does not also stop a concurrently running OnStep focuser move.",
    "WORKER_DECISION_FRESH_WAIT_S (0.5 s) comfortably covers real GUI-poll read times on the Pi.",
]
gaps = [
    "D2: OnStepAdapter has no cooperative cancel for move_*_axis_deg (enhancement request); the interrupted call runs to its own deadline.",
    "MountStatus/FocuserStatus cannot mark a held-over reading (S6.5 capability item); they are used for display only.",
    "The R1 fresh-reading wait is a lock wait on real time (a lock cannot run on a FakeClock).",
    "If the connection becomes busy between a fresh wrong-tracking reading and the repair command, the repair waits for that operation (bounded by it).",
    "No isolating test for the runner's own between-step stop flag (the adapter's latched cancel also refuses the next step); P-d (busy reason in _wait_for_parked) and the P-c pulse-only branch are untested.",
    "FocuserPanel's Stop button and the blockers() diagnostic still wait behind a running mount GOTO on the GUI thread.",
    "P-a (one-shot Terrestrial re-enforce when the busy period ends) deferred to S6.4.",
    "Panel-level pre-fix failures of the Stop tests occur in setup (the nudge click froze at 1ea9ac0), not at the Stop click itself.",
]

