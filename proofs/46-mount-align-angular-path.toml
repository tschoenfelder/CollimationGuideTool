# Proof manifest -- schema in proofs/README.md.
# Run: python scripts/prove.py 46-mount-align-angular-path
issues = [46, 31]
summary = """S6.0 / audit P01-P02: on OnStepAdapter >= 0.4 (INDI) the production \
OnStepMountPulseAdapter refuses every timed pulse, but Mount Align's calibration bootstrap, \
uncalibrated nudges and screen moves all started with a timed pulse_axis move and only went \
angular once a rate had been learned from a successful timed move -- so on the rig the mount \
never moved, and an angular refusal was masked by a doomed timed fallback. Fix: mounts that \
do not support timed pulses are driven angularly from the first move (the #46 25%-of-frame \
seed), every commanded move respects the adapter-reported 30\" floor (min_angular_arcsec), \
screen moves are validated as a whole before anything is sent, and refusal reasons are \
reported unmasked."""
modules = [
    "apps/collimation_tool/ui/mount_test_move_runner.py",
    "apps/collimation_tool/ui/mount_test_move_panel.py",
    "packages/astrotool_core/onstep/mount_pulse_adapter.py",
    "packages/astrotool_core/onstep/__init__.py",
]
fix_commits = ["787ceed"]
dataset_uuids = []
focused_command = "pytest -q tests/collimation/ui/test_mount_align_real_onstep_adapter.py"
broader_tier = "component"
field_only_assumptions = [
    "Real OnStep/INDI accepts angular moves of 30\"-~1900\" (calibration) and up to ~2166\" (nudge cap) under its tracking/park preconditions.",
    "Measured pixel displacement on the rig tracks the optics-derived seed closely enough for the 20-30% band (measured pixels stay authoritative; resize is bounded).",
    "RA/Dec-to-image orientation and signs on the rig (tested synthetically for 0/10/35 degrees and inverted signs only).",
    "A degree GOTO plus settle_ms leaves the mount at rest before the AFTER frame.",
    "The 30\" floor taken from OnStepAdapter's own constant is the real bound on the rig.",
    "Stop during a blocking angular GOTO is not yet characterized (operation_lock held for the whole move) -- tracked as S6.0c.",
]

