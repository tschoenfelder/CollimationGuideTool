# Proof manifest -- schema in proofs/README.md.
# Run: python scripts/prove.py 52-fresh-frame-after-motion
issues = [52, 43, 30, 39]
summary = """S6.7 (rollout blocker from S6.0b; audit T05): "a measurement after motion uses a frame whose \
exposure STARTED after the motion ended (+ settle), under an exposure-scaled deadline with an explicit \
timeout outcome" had no single owner. Reacquisition's angular path measured the latest displayed guide \
frame after a blind 750 ms settle (a 2 s exposure that started during the GOTO was measured); its \
guide-pulse path and autofocus used fixed budgets (6 s per stage, 5 s) that time out any streaming \
exposure above ~2-2.5 s; without a waiter reacquisition silently fell back to the latest frame; Mount \
Align's capture timing ran on the real clock. Fix: astrotool_core.acquisition.fresh_frame_after_motion \
owns the rule (measurement_reference, FreshFrameBudget = max(2 s, 2 x exposure + 1 s), deadline anchored \
at max(now, reference), extended when a delivered frame reveals a longer exposure via the new \
FrameAcquisitionResult.longest_exposure_s, explicit TIMEOUT/OVERLAPPED/UNAVAILABLE/CANCELLED). \
Reacquisition (both paths) uses it for every post-move measurement and refuses to move without a \
fresh-frame source (no_fresh_frame_source); frame failures surface as fresh_frame_timeout / \
guide_camera_unavailable. Autofocus uses it (assumed 2 s until a frame shows the exposure; failure \
reason explicit). Mount Align takes its per-frame budget and reference from the same owner and runs \
its capture timing on an injected clock. Review fixes: every runner outcome (also a move whose pending action Stop dropped, or a stranded return) is the next BEFORE capture's motion reference; waits run in 0.5 s slices so Stop (also autofocus' cancel) ends them within one slice, capped at 61 s (2 x MAX_MEASUREMENT_EXPOSURE_S 30 s + 1 s); the ToupTek adapter stamps the software trigger into Frame.exposure_started_at and StreamController stamps captured_at = trigger + exposure (was after capture = exposure end + readout + pull + copy, which put the derived exposure start AFTER the real one)."""
modules = [
    "packages/astrotool_core/acquisition/fresh_frame_after_motion.py",
    "packages/astrotool_core/acquisition/stable_frame_acquisition.py",
    "packages/astrotool_core/acquisition/__init__.py",
    "apps/collimation_tool/application/star_acquisition.py",
    "apps/collimation_tool/application/autofocus_controller.py",
    "apps/collimation_tool/ui/mount_test_move_panel.py",
    "packages/astrotool_core/frames/frame.py",
    "packages/astrotool_core/camera/touptek_adapter.py",
    "packages/astrotool_core/acquisition/stream_controller.py",
]
fix_commits = ["9fc3fa2"]
dataset_uuids = []
focused_command = "pytest -q tests/core/acquisition/test_stream_controller.py tests/core/camera/test_touptek_adapter_simulated.py::TestExposureStartIsStampedAtTheTrigger tests/core/acquisition/test_fresh_frame_after_motion.py tests/collimation/application/test_star_acquisition_fresh_frames_simulated.py tests/collimation/application/test_autofocus_controller_fresh_frames_simulated.py tests/collimation/ui/test_mount_test_move_panel_fresh_frames.py tests/collimation/application/test_star_acquisition_guide_pulse_simulated.py::TestAstronomicalReacquisitionWithGuidePulses::test_without_a_fresh_frame_source_nothing_is_sent"
broader_tier = "component"
field_only_assumptions = [
    "On the real ToupTek SDK the exposure starts at or after Trigger(1) returns control (the adapter stamps just before calling it), and get_ExpoTime() is the exposure actually used for that frame -- so captured_at = trigger + exposure is never later than the real exposure end.",
    "MailboxFrame.captured_at is now the exposure END (trigger + exposure) for ToupTek frames instead of the after-pull stamp: frame ages (e.g. GuideTool's latest_frame_age_s) grow by the readout/pull time -- stricter, never looser.",
    "OnStepAdapter's move_angular (GOTO) and guide_pulse return only once the motion has ended, so 'now' at the next measurement is the motion end (the 750 ms settle is then added to the exposure-start bound).",
    "750 ms (reacquisition) / frame_settle_ms (Mount Align) are enough mechanical settle after a move on the rig; unchanged values, now applied as an exposure-start bound instead of a blind sleep.",
    "Guide/main exposures above ~5 s with no frame delivered inside the first assumed budget (reacquisition 6 s, autofocus 5 s) end as an explicit fresh_frame_timeout on the FIRST wait (no exposure hint is wired); later waits scale from the exposure seen.",
]
gaps = [
    "Deferred to S6.6 (files owned by S6.2): a GUI-thread exposure snapshot passed as exposure_hint for reacquisition (main_window) and autofocus (focuser_panel); reading the spinbox off the GUI thread is #49-forbidden. Until then the first wait of a run cannot know an exposure > ~5 s.",
    "Frames WITHOUT exposure_started_at (FakeCamera, ReplayCamera, FakeTouptekCamera -- test doubles only; every production camera is the ToupTek adapter) keep the after-capture stamp, so for them the derived start is late by the readout time. No readout bound is subtracted for that fallback (it would shift every FrameTimeline/rig boundary while no production source uses it).",
    "Mount Align's stability window (acquire_verified_frame) still hands each waiter call its whole remaining budget; Stop does not wait for it (the job is abandoned and its result discarded, #49), but the worker thread finishes only at the deadline.",
    "Mount Align nudges still wait for BEFORE/AFTER measurement frames (AGENTS.md manual-move rule): not decoupled -- the nudge measurement is pinned by proofs/43.toml (test_a_nudge_that_moved_nothing_is_not_a_confirmed_displacement), so removing it needs a product decision (S6.6). RESOLVED in S6.6b by the user decision of 2026-10-10: a nudge is sent at once and returns when the move completes; the #43 check runs afterwards on fresh frames (proofs/52-nudge-returns.toml).",
    "The Mount Align tests in test_mount_test_move_panel_fresh_frames.py cannot run on the pre-S6.7 code (no clock seam: import/constructor error), and Mount Align's exposure-start rule and 2E+1 scaling predate S6.7 -- they characterize the migrated timing, not a reproduced defect.",
    "On the guide-pulse path the pre-S6.7 two-stage settled wait was already fresh for short exposures; the [0.5/2.0-guide_pulse] cases of the freshness test fail pre-fix only because the recorder counts the discarded stage-1 frame (see evidence). Its real pre-fix defects are the long-exposure timeout and the silent latest-frame fallback.",
    "TestMountTestMovePanel runs MainWindow's panel on fake time via a test subclass; tests that also stream real ReplayCamera frames into CameraPanel.wait_for_frame_after mix the fake panel clock with real frame stamps (freshness trivially satisfied there); real freshness is covered by test_calibration_frame_validity.py and the new FrameTimeline tests.",
    "test_calibration_failure_recovery.py is now on fake time for every wait but stays ~70 s: the remainder is CPU in the translation estimator (cProfile: ~23 of 27 s of the slowest test in measure_translation_offset_with_tier), not waiting.",
]

