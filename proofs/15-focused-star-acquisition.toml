    "AC 1.4/1.5 (still unchecked on GitHub): guide-camera identification of the real star on a real sky and the real mount's correction converging back into the main FOV are proven only on the OnStep simulator and synthetic frames.",
    "Real seeing/scintillation keeps the tracked star within the ROI tolerance used by RoiTracker.",
]
gaps = [
    "AC 1.7 lists target_not_found_main/target_not_found_guide/target_ambiguous/mount_correction_rejected/reacquisition_diverging/reacquisition_timeout/cancelled: each has its own test in test_star_acquisition.py except that 'stops automatic mount corrections' is asserted only through the result status, not by counting mount calls after the failure.",
]

