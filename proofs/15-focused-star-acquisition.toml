]
fix_commits = ["ff05812"]
dataset_uuids = []
focused_command = """pytest -q \ntests/core/target/test_roi_extraction_synthetic.py \ntests/core/target/test_roi.py::TestComputeRoiBounds \ntests/collimation/application/test_star_acquisition.py::TestAC1_2FollowStarInsideRoi \ntests/core/target/test_roi_tracker.py::test_nearby_source_within_tolerance_keeps_locked_and_updates_position \ntests/collimation/application/test_star_acquisition.py::TestAC1_3StarLeavesRoiButStaysInFrame \ntests/collimation/application/test_star_acquisition.py::TestAC1_4GuideAssistedReacquisition \ntests/collimation/application/test_star_acquisition_simulated.py::TestGuideReacquisitionOnTheProductionAdapter::test_the_star_is_brought_back_to_mains_field \ntests/collimation/application/test_star_acquisition.py::TestAC1_5TransferBackToMainTracking \ntests/collimation/application/test_star_acquisition.py::TestAC1_6PreserveTargetIdentity \ntests/core/target/test_identity_match.py::TestResolveIdentity \ntests/collimation/application/test_star_acquisition.py::TestAC1_7ReacquisitionFailure"""
