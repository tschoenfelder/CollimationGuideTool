issues = [15]
summary = "Fine-collimation Stage 1 (#15): select a focused star, track it in an ROI, reacquire it in the full main frame and, when it leaves the main FOV, via the guide camera with verified mount corrections, preserving target identity and failing with machine-readable reasons. S7 maps every AC to its lowest-tier test; AC 1.1 gained an end-to-end synthetic ROI-extraction test."
modules = [
    "apps/collimation_tool/application/star_acquisition.py",
