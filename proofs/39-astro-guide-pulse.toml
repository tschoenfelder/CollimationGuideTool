field_only_assumptions = [
    "USER-SUPERVISED, before the pin bump: the first physical guide pulse on the rig with OnStepAdapter 0.5.0 (tracking ON, astronomical mode) -- that INDI TIMED_GUIDE_NS/WE moves the mount, completes per chunk, and leaves tracking ON; then one guide-pulse reacquisition with the star in Guide.",
    "The real guide rate x guide-camera scale gives >= 4 px of star motion within 5 s of guiding per direction and within the excursion cap (0.35 x the guide tracker radius) (e.g. 0.5x sidereal at ~3.3\"/px: ~11 px at the equator, ~5.7 px at dec 60 deg on RA). Below that the calibration fails explicitly ('guide rate too low'); it never guesses.",
    "Guide-pulse response is linear in duration and stable for the session (one calibration per FocusedStarAcquisition); a strongly asymmetric east/west response (OnStep guide rate near 1x sidereal stops RA on east pulses) is measured per direction, tested synthetically at 0.8x east vs 1.0x west.",
    "Whether the real driver/firmware ends a running guide timer on ABORT is unknown: the simulator lets a chunk in flight finish; Stop is then effective at 0.5.0's next chunk preflight (tracking OFF), i.e. within <= 500 ms of guiding.",
    "0.5.0's meridian supervisor (it may stop tracking at the hard stop on its own thread) is not modelled; its effect reaches this app as a refused next pulse plus tracking_off.",
    "The Guide panel's wait_for_frame_after + acquire_settled_frames (6 s per stage, 750 ms settle) delivers a fresh frame in the field (Guide exposures up to ~2 s); interim until the shared fresh-frame service S6.7.",
    "The OnStepMountParkAdapter's fresh tracking reading (decision_status, 0.5 s wait) reflects the mount's real tracking state when reacquisition starts.",
]
