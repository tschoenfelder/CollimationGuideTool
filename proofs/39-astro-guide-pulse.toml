issues = [39]
summary = """S6.0d (#39, user decision 2026-10-04): in Astronomical mode with tracking ON, guide-assisted \
reacquisition could not move the mount at all -- OnStepAdapter 0.4.1's axis GOTO refuses a tracking mount \
and nothing else was available, so every attempt ended 'mount_correction_rejected'. OnStepAdapter 0.5.0 \
(unpublished; main stays pinned to 0.4.1) adds mount.guide_pulse(direction, ms): INDI timed guide, \
tracking kept, 20..5000 ms in 500 ms chunks, safety preflight before each chunk and after the last, one at \
a time, emergency_stop (ABORT + TRACK_OFF) on a failure after an issued chunk. Fix: OnStepMountPulseAdapter \
detects it once per connection (facade guide_pulse + exported bounds) and reports a NEW capability \
supports_guide_pulses_while_tracking (supports_pulse_guiding, Mount Align's timed/angular choice, is \
unchanged), exposes guide_pulse(axis, direction, ms) under operation_lock with S6.0c's Stop latch, and \
normalizes 0.5.0's result (refusal text, tracking_preserved, warnings, chunks) plus a fresh status read \
after a sent-then-failed pulse AND after a Stop-latch refusal (tracking_off: 0.5.0's own tracking_preserved \
predates its emergency stop); the cause is attributed to the user's Stop when it was one, and an unreadable \
status or an unconfirmed 0.5.0 emergency stop reads 'tracking may be OFF -- check the mount'. The \
reacquisition decides its motion up front from the global OperatingMode, a fresh tracking reading and the \
capability: Terrestrial / tracking OFF keep the S6.0b angular path unchanged; Astronomical + tracking ON \
uses guide pulses, or refuses unsent with 'astronomical reacquisition needs OnStepAdapter >= 0.5.0 (guide \
pulses while tracking)'; an unreadable tracking state fails closed; the mode is re-read between pulses and \
leaving Astronomical ends the run as 'operating_mode_changed'. The guide rate is not exposed, so px per \
guide-ms is measured: a bounded per-direction calibration (probes 0.25/0.75/1/3 s, later probes capped from \
the measured response so the excursion stays within one reacquisition step, until >= 4 px, <= 5 s per \
direction, paired W/E N/S), measured on settled frames whose exposure started after the pulse \
(acquire_settled_frames over the Guide panel's wait_for_frame_after), then the S6.0b 2-D solve (rotation / \
mirroring / unequal and asymmetric scales) with guide pulses capped per axis. Tracking is never started or \
stopped by the app; a pulse after which the mount no longer tracks is 'mount_tracking_stopped'; \
OnStepAdapter warnings (meridian_flip_required) are shown even on success. The #51 simulator models \
0.5.0's guide_pulse opt-in per scenario (default stays 0.4.1), checked field for field against the real \
0.5.0 IndiGuideController (implementer 32/32 scenarios; reviewer 3150/3150 identical)."""
