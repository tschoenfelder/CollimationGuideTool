# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 49
issues = [49]
summary = """Mount Align froze the UI: every BEFORE/AFTER capture waited 24-60 s for fresh \
frames inside a click/timer handler on the Qt GUI thread (bundle 6d33f37c). Fix: frame \
waits run on a worker thread (threaded_captures), every failure returns to an idle, \
retryable state through one fail-safe path."""
modules = [
    "apps/collimation_tool/ui/mount_test_move_panel.py",
    "apps/collimation_tool/ui/main_window.py",
    "apps/collimation_tool/main.py",
]
fix_commits = ["fed00fa"]
# The bundle's frames are not needed: its evidence is the mount_test_move_timeline
# (10 back-to-back BEFORE waits, no pulse ever commanded), which
# TestBundle6d33f37cRegression reproduces with a deterministic timing rig.
dataset_uuids = ["6d33f37c"]
focused_command = """pytest -q \
tests/collimation/ui/test_calibration_failure_recovery.py::TestTheEventLoopStaysResponsive \
tests/collimation/ui/test_calibration_failure_recovery.py::TestBundle6d33f37cRegression \
tests/collimation/ui/test_calibration_failure_recovery.py::TestEveryFailureReturnsToIdle \
tests/collimation/ui/test_calibration_failure_recovery.py::TestStop"""
broader_tier = "component"
field_only_assumptions = [
    "That no OTHER hardware-dependent wait remains on the GUI thread in the real rig's Mount Align flow (the tests cover the capture path only).",
]
gaps = [
    "The recovery tests run on the wall clock (the file takes ~80 s; TestOtherFailureClasses::test_no_motion_is_reported_and_the_panel_is_reusable alone ~39 s): move them to astrotool_core.timing.FakeClock once the Mount Align runner is on injected time (#53 part B / S3b).",
]

