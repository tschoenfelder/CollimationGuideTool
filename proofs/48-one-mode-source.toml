# Proof manifest -- schema in proofs/README.md.
# Run: python scripts/prove.py 48
issues = [48, 44]
summary = """S6.4 (#48 + user decision M04 + S6.0c review P-a + S3a clock dependency + user decisions A/B of \
2026-10-06): the global OperatingMode was not the only Terrestrial/Astronomical source. Mount Align kept a \
local Star/Terrestrial toggle (in Astronomical the toggle alone decided measurement and tracking; MainWindow \
only copied the mode into it), autofocus had its own Star/Terrestrial selector independent of the mode, \
ASTAP star-field registration was selectable in Terrestrial, Astronomical + Artificial star could coexist, \
a Mount Align capture snapshotted with tracking ON could re-enable tracking after a switch to Terrestrial \
(TrackingEnforcer.verify(ON) ran in Terrestrial, also when the switch landed during the check), and \
entering Terrestrial while the mount was busy stayed BLOCKED until the next measurement gate. Fix: Mount \
Align's toggle is removed -- measurement strategy and tracking need (TrackingEnforcer.measurement_tracking) \
are read live from the enforcer's mode; a mode change refreshes a read-only line and stops a run started \
under the old mode (Stop's own notes kept). Autofocus: Terrestrial -> Tenengrad, Astronomical -> \
star/FWHM, Artificial star stays a target-type toggle; a mode change cancels a running autofocus. \
USER DECISION A (2026-10-06): an artificial star is a fixed target -- choosing it (collimation target or \
the registration Artificial Star button) switches the global mode to Terrestrial (tracking OFF via the \
normal #44 switch, P-a when busy) with a visible note; choosing Astronomical returns the target to \
Natural star with a note (honours the explicit mode click instead of refusing it), so Astronomical + \
Artificial star cannot exist. The rule lives in MainWindow's mode wiring; TrackingEnforcer.set_mode alone \
does not apply it. USER DECISION B (2026-10-06): ASTAP star-field registration is selectable only in \
Astronomical; NCC registration stays available in both modes (Moon/planet texture at night). \
TrackingEnforcer: refuses tracking ON while Terrestrial (also when the mode switched during the check -- \
closed gate + owed re-enforce), takes clock= for the settle poll, turns a device error or a raising status \
read (e.g. an unconfirmed OnStep emergency stop) into a closed gate without retrying, stores gate and \
pending flag atomically under its lock (never held across mount I/O) so a GUI tracking-OFF check that \
finishes after an overtaking worker tracking-ON check cannot leave 'off verified' while tracking is ON, \
and leaves a one-shot re-enforce pending when a Terrestrial enforcement finds the mount busy; MainWindow's non-blocking tick (no-op unless pending) carries it out once a fresh reading \
exists. S6.0c fail-closed semantics unchanged. Diagnostics report operating_mode / measurement_mode \
(Mount Align), autofocus_mode (focuser) and the collimation target_mode independently."""
modules = [
    "packages/astrotool_core/mount/operating_mode.py",
    "apps/collimation_tool/ui/mount_test_move_panel.py",
    "apps/collimation_tool/ui/focuser_panel.py",
    "apps/collimation_tool/ui/main_window.py",
]
fix_commits = ["be7353e"]
dataset_uuids = []
focused_command = "pytest -q tests/core/mount/test_operating_mode.py tests/collimation/ui/test_operating_mode_ui.py tests/collimation/ui/test_focuser_panel.py::TestModeFollowsTheOperatingMode tests/collimation/ui/test_focuser_panel.py::TestArtificialStarMode tests/collimation/ui/test_collimation_main_window.py::TestMountTestMovePanel::test_a_global_mode_change_during_calibration_stops_the_run tests/collimation/ui/test_collimation_main_window.py::TestMountTestMovePanel::test_diagnostic_context_reports_the_operating_and_measurement_mode tests/collimation/ui/test_collimation_main_window.py::TestArtificialStarAutofocusWiring"
broader_tier = "component"
field_only_assumptions = [
    "On the rig, switching the global mode while a Mount Align GOTO runs sends OnStep's stop (the panel's Stop path) and the run ends with 'operating mode changed'; the interrupted OnStepAdapter call still runs to its own deadline (S6.0c D2).",
    "The P-a re-enforce fires within ~0.5 s (QTimer tick) after the OnStep connection is released; the follow-up stop_tracking (OnStep emergency stop) is accepted then -- if it is not confirmed (OnStepAdapter#17) the gate stays closed with that reason and nothing is resent.",
    "Operators accept that autofocus in Terrestrial mode always uses Tenengrad unless the target is Artificial star (no manual metric override, user decision M04).",
    "User decision A: choosing an artificial star while Astronomical turns tracking OFF on the real mount (via the normal Terrestrial switch) -- intended, confirmed by the user 2026-10-06.",
]
gaps = [
    "M02 (two tracking-verification paths in Mount Align: enforcer.verify vs direct ensure_tracking_mode when no enforcer is wired) is not consolidated -- outside S6.4's contract text; changing it alters the unavailable-mount refusal.",
    "M03 (MountTestMoveRunner turns tracking off before every move whatever the mode) untouched -- runner not in S6.4's allowed files (S6.8).",
    "M05 structure: Astronomical + Artificial star can no longer exist (decision A), but the artificial-star choice still has three representations (CollimationTargetMode, the registration button, the autofocus toggle synced one-way) and _calibration_distance_m reads the registration button -- one owner still to be made.",
    "Registration: only the UI choice is constrained; _on_calibrate_fov does not itself reject a programmatic star-field + Terrestrial combination.",
    "The tracking settle poll (ensure_tracking_mode) is still not interruptible by Stop -- no cancel hook falls out naturally (S6.3).",
    "The P-a trigger is a MainWindow QTimer tick, not the mount park panel's own status poll (mount_park_panel.py is outside S6.4's files); move it into DeviceConnectionService's poll in S6.2.",
    "No test drives the mid-run mode change for a nudge/screen move (only for calibration); the code path is the same running-check + Stop.",
    "Diagnostics: Mount Align's old target_mode key (star/terrestrial) was renamed to measurement_mode without an alias -- no code or test reads it; only stored bundles (datasets/regressions/35 provenance) contain it.",
]

