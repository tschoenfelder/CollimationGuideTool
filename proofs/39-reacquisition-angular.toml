# Proof manifest -- schema in proofs/README.md.
# Run: python scripts/prove.py 39-reacquisition-angular
issues = [39]
summary = """S6.0b (#39 AC 5, audit P01): guide-assisted reacquisition drove CollimationRecenterPolicy, \
which always corrected with a timed pulse_axis. The production OnStepMountPulseAdapter \
(OnStepAdapter >= 0.4 over INDI) has no timed primitive and refuses every pulse, so every \
reacquisition ended 'mount_correction_rejected' without moving the mount, and the adapter's reason \
was dropped. Fix: on a mount whose capabilities().supports_pulse_guiding is False the policy corrects \
with move_angular, solved in 2-D from both axes' measured Guide responses (solve_screen_move: a \
rotated or mirrored camera converges), each component converted through one public ms<->arcsec owner \
(equivalent_duration, S6.0's unit: equivalent ms at calibration_center_rate_x x sidereal), capped on \
its own (never scaled below the 30\" floor; unequal RA/Dec image scales away from the equator) and \
planned by one rule shared with Mount Align's screen moves (angular_move_plan: floor, sub-floor \
component dropped only when its share of the full error is small, whole correction validated before \
anything is sent). A reacquisition step is sized per axis from the Guide tracker radius (0.35x) and frame (0.25x) (max_step_px) \
instead of the fixed ~60\" cap. main_window passes the loaded calibration_center_rate_x; refusal \
reasons travel AcquisitionResult.detail -> FineCollimationOutcome.detail -> the status text; a \
reacquisition re-arms an earlier latched Stop (shared rearm_after_stop, also the Mount Align runner) \
while a Stop during it still stops it; a cap below the floor is reported as a configuration problem. \
Timed mounts are unchanged (their rotation blindness is pinned by a strict xfail)."""
modules = [
    "apps/collimation_tool/application/recenter_policy.py",
    "apps/collimation_tool/application/star_acquisition.py",
    "apps/collimation_tool/application/equivalent_duration.py",
    "apps/collimation_tool/application/angular_move_plan.py",
    "apps/collimation_tool/application/mount_commands.py",
    "apps/collimation_tool/application/fine_collimation_controller.py",
    "apps/collimation_tool/ui/fine_collimation_panel.py",
    "apps/collimation_tool/ui/main_window.py",
    "apps/collimation_tool/ui/mount_test_move_panel.py",
    "apps/collimation_tool/ui/mount_test_move_runner.py",
]
fix_commits = ["f24a523"]
dataset_uuids = []
focused_command = "pytest -q tests/collimation/application/test_recenter_policy_simulated.py tests/collimation/application/test_star_acquisition_simulated.py tests/collimation/application/test_equivalent_duration.py tests/collimation/application/test_angular_move_plan.py tests/collimation/application/test_recenter_policy.py::TestTimedPathCharacterization tests/collimation/application/test_recenter_policy.py::TestTimedPathRotation tests/collimation/application/test_recenter_policy.py::TestAngularPathWithoutAUsableMotion tests/collimation/application/test_recenter_policy.py::TestBelowTheFloorOnSkewedAxes tests/collimation/application/test_star_acquisition.py::TestAC1_4GuideAssistedReacquisition::test_mount_rejection_is_reported_distinctly tests/collimation/application/test_fine_collimation_controller.py::TestGuideAssistedReacquisition::test_a_refused_reacquisition_carries_the_mounts_reason tests/collimation/ui/test_fine_collimation_panel.py::TestAC7_2InvalidResult::test_a_failed_run_shows_the_mounts_refusal_detail tests/collimation/ui/test_collimation_main_window.py::TestArtificialStarTargetMode::test_reacquisition_reads_the_guide_matrix_in_the_configured_center_rate"
broader_tier = "component"
field_only_assumptions = [
    "Real OnStep/INDI accepts reacquisition-sized angular moves (30\" floor .. a 28 px guide-image step per axis, ~185\" at 6.6\"/px) with tracking OFF (terrestrial / artificial star). OnStepAdapter 0.4.1 refuses local axis moves while tracking (modelled by the simulator): in astronomical mode reacquisition is refused with that reason shown -- a user decision, recorded by the coordinator.",
    "The rig's Guide calibration matrix was produced by Mount Align on the angular-only adapter (equivalent-ms unit) with the calibration_center_rate_x configured now.",
    "The Guide response is linear and close to the matrix over a 28 px per-axis step (tested robust to a real response 1.5x the matrix, or 2x on RA), and the RA/Dec image axes are near-orthogonal (per-component capping then shrinks each axis' share of the error); tested synthetically for RA image-scale factors 1.0/0.7/0.5, arbitrary rotations and mirroring.",
    "Each GOTO plus the 750 ms settle leaves the mount at rest before the next guide frame is measured -- no fresh-frame-after-motion check in this loop (S6.7, rollout blocker).",
    "A Stop during a reacquisition GOTO is honoured by OnStep (S6.0c's assumption); the reacquisition's own cancel_check does not interrupt a running GOTO.",
]
gaps = [
    "Timed path (no production timed mount wired) is rotation-blind: pinned by the strict xfail TestTimedPathRotation, not fixed (frozen in S6.0b).",
    "cancel_check is consulted between corrections only; a running angular GOTO is not interrupted by the reacquisition's cancel (recorded by the coordinator).",
    "No fresh-frame check after each move (S6.7).",
    "OnStepAdapter's 10-degree maximum is not reported by the adapter (only min_angular_arcsec is); the frame/tracker-sized step stays far below it, and a refusal beyond it would be surfaced.",
    "With the policy's fallback cap (no frame geometry: ~60\" per move) a large error can exhaust max_iterations (reported as max_pulses, error still decreasing); reacquisition always passes the frame-sized step.",
    "Floor-limited residuals: at fine plate scales (e.g. 1\"/px) a sub-30\" remainder can exceed the 20 px rough tolerance; it is a success with an explicit 'within the mount's smallest move' message when within sqrt(2) x a floor-sized move (coordinator decision), a failure beyond that (only reachable with strongly skewed axes).",
    "Several pre-fix runs were reconstructions: the first S6.0b fix and the pre-re-review state rebuilt in separate worktrees by re-applying/reversing the recorded edit scripts; the main_window wiring and detail-display tests fail before the fix by KeyError/TypeError on an absent keyword.",
    "RECENTER_DROP_TOLERANCE (0.5) differs in value from the screen moves' 0.25 by design (closed loop, re-measured each step); both go through the one shared rule.",
]

