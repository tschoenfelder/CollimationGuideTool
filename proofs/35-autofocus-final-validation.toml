modules = [
    "apps/collimation_tool/application/autofocus_search.py",
    "apps/collimation_tool/application/autofocus_controller.py",
    "apps/collimation_tool/ui/focuser_panel.py",
]
fix_commits = ["758e221"]
dataset_uuids = ["73a007b6-6c9b-41e2-a3e5-66a21ec71ffd"]
focused_command = """pytest -q \ntests/collimation/application/test_autofocus_search.py::TestBoundarySafetyNet::test_boundary_reached_while_still_rising_is_not_reported_success \ntests/collimation/application/test_autofocus_search.py::TestFinalValidation::test_final_confirmation_worse_than_start_is_reported_inconsistent \ntests/regressions/test_issue_35_autofocus_search_regression.py::test_terrestrial_curve_never_turns_over_before_search_boundary \ntests/collimation/application/test_autofocus_controller.py::TestAutofocusControllerStarMode::test_result_records_camera_and_focuser_identity \ntests/collimation/ui/test_focuser_panel.py::TestAutoFocusRun::test_optical_train_label_appears_in_status_text_and_diagnostics \ntests/collimation/application/test_autofocus_controller.py::TestAutofocusControllerTerrestrialMode::test_terrestrial_mode_samples_multiple_frames_per_position \ntests/collimation/application/test_autofocus_controller.py::TestAutofocusControllerStarMode::test_wait_for_frame_is_called_with_a_reference_timestamp_for_every_sample \ntests/collimation/application/test_autofocus_search.py::TestRejectionCancellationAndFrameLoss::test_frame_acquisition_failure_mid_search_aborts_to_best_known_safe \ntests/collimation/application/test_autofocus_search.py::TestHardSafetyEnvelope \ntests/collimation/application/test_autofocus_controller.py::TestAutofocusControllerStarMode::test_a_full_star_mode_run_converges_and_reports_success"""
