# Proof manifest (F56) -- schema in proofs/README.md. Run: python scripts/prove.py 56-terrestrial-autofocus
issues = [56]
summary = """Terrestrial autofocus failed on a real low-texture scene (diagnostics 402eabde daytime, f0bc314b \
dusk: antenna mast against a bright sky, noise sigma ~840 ADU). (A) FocuserPanel's checkable 'Artificial \
star' button was a second owner of the autofocus target type (the run used artificial_star while the \
collimation target mode was natural_star): the panel now only shows it. (B) measure_terrestrial_focus \
compared a tile's change with the tile's own std -- the noise, for a featureless tile -- so 1760/1839 of \
1980 real tiles were rejected as moving, and its median score was flat/non-monotone under blur, so the \
search returned to the start. Now: 4x4 binning, identical samples once, moving = largest pairwise change \
> 3x the median tile change AND > 1.0x the tile std, per-tile energy = mean of per-sample energies (order \
independent: one position's score within 4.4 % over every ordering/subset/duplicate, was 27-58 %), score \
= strongest 3 % static tiles minus the measured one-sample noise energy; rejected_low_texture_tile_count \
now means 'static tiles below the top-detail selection'. (C, review F2/F3) the extra samples were \
get_frame() re-reads of one frame -- now distinct fresh frames; clipped glints carry 72-93 % of the real \
scores and, far above full scale, drove the search off focus -- terrestrial now uses the ExposureControl \
step-down while clipped tiles carry > 50 % of the score (exposure restored afterwards) and reports \
INSUFFICIENT_EVIDENCE / highlights_clipped if that does not help, never a bare SUCCESS. Test-fixture \
change: _box_blur in test_terrestrial_focus_metric.py is edge-padded (its zero padding manufactured a \
frame-border edge that grows with blur). The dusk bundle's incident autofocus record is the stale \
artificial-star run (start 14461, 18.575 ms); the terrestrial run was still in progress at capture."""
modules = [
    "apps/collimation_tool/ui/focuser_panel.py",
    "packages/astrotool_core/focus/terrestrial_focus_metric.py",
    "apps/collimation_tool/application/autofocus_controller.py",
]
fix_commits = ["666b027", "a2901e8", "a0e0dcc"]
dataset_uuids = ["402eabde-d730-43b0-823d-a7f47c61f944", "f0bc314b-a889-4e18-ac9b-74971f42f014"]
focused_command = """pytest -q \
tests/collimation/ui/test_focuser_panel.py::TestTheTargetTypeHasOneOwner \
tests/collimation/ui/test_focuser_panel.py::test_a_clipping_dominated_terrestrial_result_tells_the_user_to_lower_exposure \
tests/core/focus/test_terrestrial_focus_metric.py \
tests/collimation/application/test_autofocus_controller_terrestrial.py \
tests/regressions/test_issue_56_terrestrial_autofocus_regression.py \
tests/regressions/test_regression_datasets.py \
tests/regressions/test_issue_35_autofocus_search_regression.py"""
broader_tier = "integration"
field_only_assumptions = [
    "A real terrestrial Auto Focus sweep on the rig converges on visibly best focus (the regressions prove the metric's slope on added blur of the real frames and the controller+searcher on a simulated defocus, not the focuser's real defocus/backlash).",
    "A real sweep with clipped glints: the exposure step-down (factor 0.5, up to 3 attempts) brings the clipped share below one half and the run lands on focus, or it reports highlights_clipped. How far above full scale the real glints are is unknowable from the clipped bundles (simulated K = 1/3/10).",
    "Three distinct fresh frames per position multiply the per-position time by about 3 exposures (2 s at dusk -> ~6-10 s per position); acceptable on the rig is a field judgement.",
]
gaps = [
    "LOCAL-ONLY proofs (user decision: large test data is never committed): every real-frame test in tests/regressions/test_issue_56_terrestrial_autofocus_regression.py (blur sweep, noise-only, replaced tile, one-position stability, K-simulation) needs local_test_data/56*/frames/ (git-ignored, recreate with scripts/pull_diagnostic_bundle.py + scripts/slim_regression_frames.py, see the datasets' READMEs) and skips with that reason without them -- on CI and in any checkout without the frames. Without the frames the logic is still proven by the synthetic, mutation-proven tests: tests/core/focus/test_terrestrial_focus_metric.py (noise, motion/ratio clause, order and duplicates, air shimmer, foliage, floor value, confidence + clipped share, non-finite) and tests/collimation/application/test_autofocus_controller_terrestrial.py (distinct fresh samples, dedupe, exposure step-down/restore/highlights_clipped); all 15 mutations of the review's list (plus dedupe, pair and controller mutations) are killed with the frames ABSENT too (mutation run without local_test_data: 15/15 caught).",
    "The motion-test threshold separates real-frame mast shimmer (change <= 0.80 x std) from fully replaced content (~1.13 x std) with a thin margin; defocused foliage (sigma >= 4 px) is often not rejected -- it then carries little energy and the curve stays monotone (TestFoliage), but a strongly textured, sharp, partly-moving scene was not available as real data.",
    "The one-position stability bound (< 5 %) is close to the real frames' own frame-to-frame variation (4.3 % between single frames of 402eabde).",
    "The K-simulation models defocus as a Gaussian of the frames' mean and the glints as K x full scale; the C8's real defocus PSF is closer to an annulus.",
    "max_exposure_attempts (3) bounds the step-down to 1/4 of the start exposure; K = 10 glints stay clipped and are reported, not focused.",
    "test_regression_datasets.py (#35 real-sweep pair 14985 vs 15485) and test_issue_35_autofocus_search_regression.py did not fail before the fix; listed to pin that they still pass (#35 pair ratio 1.09 -> 8.35).",
]

