# Proof manifest (F58) -- schema in proofs/README.md. Run: python scripts/prove.py 58-artificial-star-acquisition
issues = [58]
summary = """Artificial-star autofocus failed at once with several heavily over-exposed stars (diagnostic \
4c5677d0: four clipped blobs at 2000 ms, no_usable_evidence / multiple_candidates on the first frame, focuser \
never moved). detect_sources (unchanged, shared) splits each clipped plateau + halo into dozens of local maxima \
(785 sources for 4 stars) and StarTargetTracker.acquire refused anything but exactly one source. Fix: \
group_star_candidates (new star_candidates.py) makes one candidate per blob by topographic prominence on a 5x5 \
box-smoothed image (a source founds a candidate only if its region above 'level - max(8 smoothed-noise sigma, \
5 % of amplitude)' reaches no brighter candidate) -- 785/769/774 -> 4/4/4 on the real frames; one source is \
returned unchanged. The tracker acquires the candidate nearest the image centre (green cross, #57) and reports \
the count (two equally near < 2 px: still multiple_candidates). The controller steps a clipped target down at \
acquisition (shared _lower_exposure + _exposure_lowered restore, halving, at most 12 steps or the camera minimum, \
else saturated_at_min_exposure; a target not found right after a lowering is stepped further, as detect_sources \
skips components > 5000 px); those steps do not use up max_exposure_attempts. AutofocusResult.target_candidates; \
the focuser panel says 'following the star nearest the centre (N found)'."""
modules = [
    "packages/astrotool_core/focus/star_candidates.py",
    "packages/astrotool_core/focus/star_focus_metric.py",
    "apps/collimation_tool/application/autofocus_controller.py",
    "apps/collimation_tool/ui/focuser_panel.py",
]
fix_commits = ["3784aeb"]
dataset_uuids = ["4c5677d0-c97a-4a5a-9a10-86d8f71c95dd"]
focused_command = """pytest -q \
tests/core/focus/test_star_candidates.py \
tests/core/focus/test_star_target_tracker.py \
tests/collimation/application/test_autofocus_controller_artificial_star.py \
tests/collimation/application/test_autofocus_artificial_star.py \
tests/collimation/ui/test_focuser_panel.py \
tests/regressions/test_issue_58_artificial_star_acquisition_regression.py"""
broader_tier = "integration"
field_only_assumptions = [
    "A real artificial-star Auto Focus sweep on the rig with several stars: the star nearest the centre cross is followed, the exposure is stepped down until it is unclipped, the run converges on visibly best focus and the exposure/gain are restored afterwards. The clipped bundle frames cannot be re-exposed off-rig; the step-down and the sweep are proven only on the simulated rig (tests/collimation/application/test_autofocus_controller_artificial_star.py).",
    "How far above full scale the real stars are at 2000 ms / gain 460 (how many halvings they need) is unknowable from clipped data; the cap of 12 halvings reaches ~0.5 ms (ATR585M minimum 0.1 ms). The gain is never lowered.",
    "Unclipped at the defocused start is not unclipped at focus: a star that sharpens gets brighter, so the in-search saturation retry (max_exposure_attempts = 3) may still be needed near focus.",
    "Grouping cost: ~0.3-0.8 s per full 3840x2160 frame on the dev PC on top of detect_sources' ~10 s for these fragmented frames; per-sample time on the Pi 5 is not measured.",
]
gaps = [
    "LOCAL-ONLY (user decision: large test data is never committed): every test in tests/regressions/test_issue_58_artificial_star_acquisition_regression.py needs local_test_data/58/frames/ (git-ignored; recreate with scripts/pull_diagnostic_bundle.py + scripts/slim_regression_frames.py, see datasets/regressions/58/README.md) and skips with that reason without them (CI). The same logic is proven on CI by the synthetic tests in test_star_candidates.py (four clipped blobs incl. two with merged halos), test_star_target_tracker.py and test_autofocus_controller_artificial_star.py.",
    "Out of scope (detect_sources is frozen for its other callers): in component mode (< 25000 bright pixels) detect_sources silently drops any component larger than 5000 px, so a single big defocused/over-exposed blob can be invisible ('no_star') -- at acquisition this ends the run as no_star with no step-down; during the step-down it is handled by stepping further (simulated: no source at 1000-250 ms in the test rig). Worth an issue against target/detector.py.",
    "The real-frame grouping test (test_the_four_blobs_are_four_candidates) and the unit tests of group_star_candidates exercise the new helper itself; before the fix there was no grouping, so their pre-fix counterpart is the tracker/controller failure (multiple_candidates) recorded below.",
    "The prominence tolerance (8 smoothed sigmas, 5 %) was chosen on the three real frames: 3..30 sigmas all give 4, 2 sigmas leaves halo pieces as extra candidates, a 20 % fraction merges the two touching stars on frame_0 (their saddle is 15-20 % of the amplitude down). Other scenes (strong halos with structure, uneven donuts) may need a different value.",
]

