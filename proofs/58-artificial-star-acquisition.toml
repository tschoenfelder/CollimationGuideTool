# Proof manifest (F58) -- schema in proofs/README.md. Run: python scripts/prove.py 58-artificial-star-acquisition
issues = [58]
summary = """Artificial-star autofocus failed at once with several heavily over-exposed stars (diagnostic \
4c5677d0: four clipped blobs at 2000 ms, no_usable_evidence / multiple_candidates on the first frame, focuser \
never moved): detect_sources (shared, unchanged) split each clipped plateau + halo into dozens of local maxima \
(785 sources for 4 stars) and StarTargetTracker.acquire refused anything but exactly one. Review (APPROVE-WITH-\
FIXES, contract amendment 2026-10-27) found that detect_sources also drops components > 5000 px (F1: a big \
clipped star is 'no_star', no step-down) and that its 37x37 moment FWHM tops out at ~24 px (F2: big stars \
cannot be focused, false ALREADY_FOCUSED). Fix: the artificial-star mode no longer uses detect_sources. \
find_star_candidates (star_candidates.py) bins the frame to <= ~600k px, box-smooths 3x3, takes star pixels \
above 5 measured smoothed-noise sigmas and makes one candidate per blob by topographic prominence (9 sigma / 5 %); \
the sample value is the blob's half-flux diameter after a local-background subtraction (monotone 3..150 px, \
clipped and donut included). The tracker acquires the candidate nearest the image centre (tie < 2 px -> \
multiple_candidates) and reports the count; measure() analyses a crop around the target (F4). The controller \
steps a clipped target -- or a clipped frame without a star (F1) -- down at acquisition (shared _lower_exposure + \
_exposure_lowered restore, halving, <= 12 steps or the camera minimum, else saturated_at_min_exposure) and \
re-acquires after every step (F3: stars merged while clipped are told apart, not guessed); those steps do not use \
up max_exposure_attempts. AutofocusResult.target_candidates; focuser panel: 'following the star nearest the \
centre (N found)'. Review round 2 (N1-N3): single hot/warm pixels are replaced before segmentation, a \
candidate needs >= 5 pixels above 5 pixel-noise sigmas and an HFD >= 1.5 px, and only clipped pixels inside a \
clipped blob make a frame clipped (N1); a crop is segmented with the whole frame's statistics, so acquire() and \
measure() measure on one scale (N2); the clipping test uses the camera's full scale (capabilities.bit_depth, \
wired main_window -> FocuserPanel -> AutofocusController), kept across retry attempts, frame-max inference only \
as a fallback (N3); the half-flux diameter no longer moves in pixel steps (L2). Measured (dev PC, Windows 11 \
desktop, after round 2): find_star_candidates 0.27-0.29 s per 3840x2160 real frame (detect_sources 10.4 s); \
acquire 0.20-0.32 s; measure (crop) 0.07-0.09 s for an in-focus or sigma-20 star, 0.39 s for a clipped \
4c5677d0 blob."""
modules = [
    "packages/astrotool_core/focus/star_candidates.py",
    "packages/astrotool_core/focus/star_focus_metric.py",
    "apps/collimation_tool/application/autofocus_controller.py",
    "apps/collimation_tool/ui/focuser_panel.py",
    "apps/collimation_tool/ui/main_window.py",
]
fix_commits = ["23f4359", "cbe460d", "a990817"]
dataset_uuids = ["4c5677d0-c97a-4a5a-9a10-86d8f71c95dd"]
focused_command = """pytest -q \
tests/core/focus/test_star_candidates.py \
tests/core/focus/test_star_target_tracker.py \
tests/collimation/application/test_autofocus_controller_artificial_star.py \
tests/collimation/application/test_autofocus_artificial_star.py \
tests/collimation/ui/test_focuser_panel.py \
tests/regressions/test_issue_58_artificial_star_acquisition_regression.py"""
broader_tier = "integration"
field_only_assumptions = [
    "A real artificial-star Auto Focus sweep on the rig with several stars: the star nearest the centre cross is followed, the exposure is stepped down until it is unclipped, the run converges on visibly best focus and the exposure/gain are restored afterwards. The clipped bundle frames cannot be re-exposed off-rig; step-down and sweep are proven only on the simulated rig (Gaussian stars, flux conserved).",
    "The C8's real defocus PSF (an annulus with spider vanes, seeing, halos from scattering) is only approximated by the Gaussian and soft-annulus tests; the half-flux diameter was shown monotone on those, not on a real through-focus series.",
    "How far above full scale the real stars are at 2000 ms / gain 460 is unknowable from clipped data; the cap of 12 halvings reaches ~0.5 ms (ATR585M minimum 0.1 ms). The gain is never lowered.",
    "Unclipped at the defocused start is not unclipped at focus: a sharpening star gets brighter, so the in-search saturation retry (max_exposure_attempts = 3, i.e. 2 more halvings) may still be needed near focus.",
    "Pi 5 timing is NOT measured: from the dev-PC numbers above and a Pi 5 typically 3-5x slower in numpy, an estimated 0.6-1.6 s per full-frame acquisition and 0.2-2 s per crop measurement; Stop latency is then bounded by one exposure + about 1 s of analysis (was one detect_sources call, ~10 s PC / an estimated 20-50 s Pi).",
]
gaps = [
    "LOCAL-ONLY (user decision: large test data is never committed): every test in tests/regressions/test_issue_58_artificial_star_acquisition_regression.py needs local_test_data/58/frames/ (git-ignored; recreate with scripts/pull_diagnostic_bundle.py + scripts/slim_regression_frames.py, see datasets/regressions/58/README.md) and skips with that reason without them (CI). The same logic is proven on CI by the synthetic tests in test_star_candidates.py, test_star_target_tracker.py and test_autofocus_controller_artificial_star.py.",
    "Changed #33 behaviour (contract amendment F2): a defocused donut is now measured (larger HFD), not rejected as donut_like; tests/core/focus/test_star_target_tracker.py::TestMeasureFollowsTheSameTarget::test_a_defocused_donut_is_measured_as_a_larger_star and the two changed tests in test_autofocus_artificial_star.py say so. TrackedStarMeasurement.fwhm_px was renamed size_px (the HFD). #33's former '2 candidates -> multiple_candidates' controller test now follows the star nearest the centre.",
    "The half-flux diameter is cut at the blob's border (detection threshold, saddle to a touching neighbour): a star barely above the noise reads small (flux 2e6 in the monotonicity sweep: FWHM 96 -> 60.5, 128 -> 61.0, 150 -> not detected) and a crowded star's centre can be pulled by a few px (sigma-25 pair 70 px apart: within 6 px; the touching 4c5677d0 target: 3 px). After the step-down a star is at 0.49-0.98 of full scale, far from that regime.",
    "The prominence tolerance (9 smoothed sigmas, 5 %) was chosen on the three real frames: 6..14 sigmas give exactly 4 on all three, 4 leaves a halo piece as a fifth candidate on frame_2, 16 merges the touching pair on frame_0 (their saddle is 15-20 % of the amplitude down). Other scenes may need a different value.",
    "Full scale = 2**capabilities.bit_depth - 1 of the Main camera (ATR585M: 16 -> 65535; its frames top out at 65520, above the 0.98 limit). Only when the bit depth is unknown (not wired, or unreadable) is it inferred from the frame maximum like detect_sources -- then a dim 16-bit frame below 4096 reads as 12-bit (pinned by test_without_the_bit_depth_a_dim_16_bit_frame_reads_as_12_bit). Whether the GPCMOS02000KPA's frames really use 0..4095 was not checked (it has no focuser wired today).",
    "Review L3: a background gradient biases the half-flux diameter low (reviewer's measurement: 3 ADU/px -> 16.5 -> 12.8 px; 6 ADU/px -> no_star), because the local background is one ring median and the blob border follows the threshold. Not fixed; the C8's artificial-star scenes are dark and flat, a sky-glow gradient is a field item.",
    "A hot pixel INSIDE a bright star (brighter than its neighbours by less than 3x) is kept and can mark the star clipped; a star whose only clipped pixel is its peak is not removed (peak <= ~2x its neighbours for FWHM >= 2 px).",
    "At the production steps (250 / 25) the frozen searcher (autofocus_search.py) does not refine below its coarse probes when both neighbours are worse: on the simulated small star it lands 50 steps (two fine steps) from focus from 300 and 700 -- the metric itself changes by > 5 % per 25 steps there (test_the_size_is_a_clean_v_at_the_production_fine_step). Recorded follow-up, the searcher is frozen in this contract.",
    "tests/core/focus/test_star_candidates.py tests the new finder itself; its pre-fix counterparts are the tracker/controller failures below (multiple_candidates, no_star, false ALREADY_FOCUSED).",
]

