# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 51-touptek
issues = [51]
summary = """touptek_adapter's _FLAG_MONO was 0x40, which is the SDK's TOUPCAM_FLAG_USB30 (TOUPCAM_FLAG_MONO \
is 0x10), so is_color_sensor() answered 'not USB3': a USB3 colour camera was treated as mono (no demosaic) and \
a mono camera without the USB3 bit as colour. Four option fallbacks were wrong too (RGB, FLUSH, NOFRAME_TIMEOUT, \
AUTOEXPO_TRIGGER; on the rig unused, the real SDK module supplies option ids by name). Fix: one table \
_SDK_FALLBACKS keyed by SDK name; flags and options are looked up by name on the SDK module, a call site passes \
only the name (it cannot pair a wrong fallback), and every table value is checked against the vendored SDK."""
modules = ["packages/astrotool_core/camera/touptek_adapter.py"]
fix_commits = ["4864cc8"]
dataset_uuids = []
focused_command = """pytest -q \
tests/core/camera/test_touptek_adapter_simulated.py::TestMonoOrColourFollowsTheSdkFlag \
tests/core/camera/test_touptek_adapter_simulated.py::TestAdapterConstantsComeFromTheVendoredSdk \
tests/core/camera/test_touptek_adapter_no_hardware.py"""
broader_tier = "component"
field_only_assumptions = [
    "GPCMOS02000KPA is KNOWN to have been on the colour path before the fix (green-tinted Guide view, diagnostics 3bc76175/99926503, b0c46fe), so its USB30 bit is clear; its MONO bit being clear is inferred (colour sensor).",
    "G3M678M and ATR585M: their real flag words (USB30 and MONO bits) are not recorded anywhere, so how they were classified before the fix is unknown, and that they carry TOUPCAM_FLAG_MONO is inferred. Log device.model.flag once at connect on the Pi to confirm.",
    "A mono camera whose USB30 bit is clear (previously treated as colour) now receives OPTION_RGB=4 (16-bit grey) at connect and is no longer demosaiced; effect on the real SDK in RAW mode is pending Pi verification.",
]
gaps = [
    "No real-SDK flag dump for the rig cameras; the simulator's per-model USB bits come from the family names and are unverified.",
    "A call site that names a valid but semantically wrong SDK constant (e.g. FLUSH where NOFRAME_TIMEOUT was meant) cannot be caught by a generic test; only the wrong-fallback pairing is now structurally impossible.",
    "Resolved separately by S6.5b (973d0ab, proofs/51-touptek-noframe-timeout.toml): NOFRAME_TIMEOUT=1 was outside the documented range; now 0 (disabled).",
]

