# Proof manifest (S7) -- schema in proofs/README.md. Run: python scripts/prove.py 33-autofocus
issues = [33]
summary = "Per-optical-train autofocus (#33): one bounded search workflow (start +/- 1000 steps and device limits, no extrapolation, consistent final-approach direction for backlash, cancellable, final revalidation) with separate star (FWHM, rejects saturated/clipped, robust multi-star median) and terrestrial (multi-tile Tenengrad, moving-tile rejection, low confidence) metrics; plus artificial single-star autofocus with target tracking and exposure reduction."
modules = [
    "apps/collimation_tool/application/autofocus_controller.py",
    "apps/collimation_tool/application/autofocus_search.py",
    "apps/collimation_tool/ui/focuser_panel.py",
    "packages/astrotool_core/focus/search_bounds.py",
    "packages/astrotool_core/focus/star_focus_metric.py",
    "packages/astrotool_core/focus/terrestrial_focus_metric.py",
]
fix_commits = ["4190389", "b17e95e"]
dataset_uuids = []
focused_command = """pytest -q \ntests/collimation/ui/test_focuser_panel.py::TestAutoFocusButtonEnablement \ntests/core/focus/test_search_bounds.py \ntests/collimation/application/test_autofocus_search.py::TestHardSafetyEnvelope \ntests/collimation/application/test_autofocus_search.py::TestConsistentDirectionFinalApproach \ntests/collimation/application/test_autofocus_controller_simulated.py::TestAutofocusWorkflow::test_the_final_approach_absorbs_backlash \ntests/collimation/application/test_autofocus_controller_fresh_frames_simulated.py::TestStreamingExposures \ntests/collimation/application/test_autofocus_controller.py::TestAutofocusControllerStarMode \ntests/core/focus/test_star_focus_metric.py::TestMeasureStarFocus \ntests/core/focus/test_terrestrial_focus_metric.py::TestMeasureTerrestrialFocus \ntests/collimation/application/test_autofocus_search.py::TestRejectionCancellationAndFrameLoss \ntests/collimation/application/test_autofocus_search.py::TestFinalValidation \ntests/collimation/application/test_autofocus_search.py::TestBoundedFocusSearcherHappyPath::test_full_focus_curve_is_recorded \ntests/collimation/ui/test_focuser_panel.py::TestAutoFocusRun::test_a_full_run_updates_the_status_label_and_diagnostics \ntests/core/focus/test_star_target_tracker.py \ntests/collimation/application/test_autofocus_artificial_star.py \ntests/collimation/application/test_autofocus_search.py::TestInvalidSamplesForASingleArtificialStar \ntests/collimation/ui/test_focuser_panel.py::TestArtificialStarMode"""
