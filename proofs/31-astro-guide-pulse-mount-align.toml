field_only_assumptions = [
    "The real guide rate vs the 1.0x seed: the seed only sizes the first probe (the measured displacement resizes it, #46); a real rate far below 0.5x could leave the widest camera bounded (envelope = 2x the seed-rate need).",
    "Settle after guide pulses: the configured settle_ms is reused unchanged; whether guide-pulse moves need a different settle on the rig is unmeasured.",
    "A supervised first Astronomical calibration on the rig (S8): long guide-pulse moves (e.g. ~13-26 s of guiding for 25% of a 780\" frame at 1x / 0.5x) hold operation_lock per pulse; tracking ON throughout, OnStep 'G' flag clearing within 0.5.0's post-chunk wait.",
    "RA guide response has no cos(dec) term in the seed: at declination dec an RA guide pulse moves the star cos(dec) x the seed's angle, so the measured RA response shrinks toward the pole; GUIDE_SEED_MARGIN = 2.0 keeps the widest camera's band reachable only up to about dec 60 deg (cos 60 = 0.5) at a real rate equal to the seed -- above that (or with a slower real rate) the wide camera's RA follow-up may end bounded.",
    "Stop during a guide pulse (user decision 2026-10-21) is OnStep's emergency stop: whether the real driver/firmware also ends the running guide timer on ABORT is unknown (0.5.0 note); tracking is OFF afterwards either way, and must be restored at the hand controller.",
]
gaps = [
    "The tests drive the production OnStepMountPulseAdapter over FakeOnStepIndiClient (instant 0.5.0 guide pulses, 0.5x sidereal), not the clocked #51 simulator.",
    "S6.8d notes from the S6.8b review (not changed here, outside this contract): ASTRONOMICAL_TRACKING_AXIS_MOVE_REFUSED ('...not available yet') is now wrong in three cases -- a 0.4.1 mount (should say: needs OnStepAdapter >= 0.5.0), a stale-reading race (tracking switched on between the panel's primitive choice and the send: retry), and tracking switched on mid axis-calibration (star calibration's tracking-ON verify); mount_motion.py module docstring line 18 ('until guide-pulse Mount Align, S6.8b') is stale.",
    "No in-app path turns tracking back ON in Astronomical mode after a Stop: the enforcer's P-a re-enforce runs only in TERRESTRIAL (it clears its pending flag on Astronomical) and never starts tracking; the only start_tracking is a star measurement's verify(TrackingMode.ON), which records a trail entry (command 'start_tracking').",
    "test_a_calibrated_guide_nudge_is_capped_at_the_measured_guide_rate fails before d2024bb at the call (TypeError: unexpected keyword 'arcsec_per_px'), not at an assertion -- the measured-rate input did not exist.",
    "The panel decides the primitive from the mount's latest (possibly held-over) park/tracking reading on the GUI thread; the runner re-checks on a fresh reading. If tracking turned ON between the decision and the send, an axis move is refused by the S6.8a gate (its text still says 'not available yet' -- operating_mode.py is outside this contract, stale text for S6.8d).",
    "test_a_long_move_is_split_into_even_pulses_within_the_range and test_mount_align_guide.py / TestGuideRateSeed test scaffolding added in f63374c (no behaviour change) -- they pass before ef95c28 by construction and are listed for coverage only where marked.",
]

