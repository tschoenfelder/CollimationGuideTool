# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 31-astro-guide-pulse-mount-align
issues = [31, 46, 39]
summary = """S6.8b (user decision 2026-10-11): in Astronomical mode with the mount tracking, Mount Align \
could not move at all -- S6.8a refused every axis move on a tracking mount ('moving with guide pulses while \
tracking is not available yet') because an axis GOTO needs tracking off and Mount Align never turns it off. \
Now, with Astronomical mode + a tracking mount + supports_guide_pulses_while_tracking (OnStepAdapter 0.5.0), \
calibration (and its unmeasured returns), RA/Dec nudges and screen moves are guide pulses through the S6.8a \
executor claim (Stop, settle) -- the primitive is chosen once per move/run by \
mount_motion.choose_mount_align_primitive and re-checked by the runner on a FRESH reading (still \
Astronomical, unparked, tracking, capability) before anything is sent; nothing is unparked, parked or \
tracking-changed on this path. Sizes are guide-pulse ms: the calibration matrix carries \
CalibrationMatrix.unit = GUIDE_PULSE_MS; a matrix of one primitive never sizes moves of the other (refused, \
'recalibrate in this mode', nothing sent), and calibration_for() hands guide-assisted reacquisition only \
axis-unit matrices. OnStepAdapter exposes no guide rate, so the first calibration move and the uncalibrated \
nudge are sized from the explicit MountAlignmentSettings.guide_rate_seed_x (default 1.0x sidereal, \
config key [mount_alignment] guide_rate_seed_x), labelled as an assumption in the status line and the \
sizing log ('guide_rate_assumed'), and replaced by the measured response (#46 probe resizing). A move longer \
than one pulse (0.5.0: 20..5000 ms) is split into even pulses with Stop checked between them; a failed \
pulse is final and says when the mount no longer tracks. USER DECISION 2026-10-21: Mount Align's Stop during \
a guide-pulse move stays an immediate EMERGENCY stop (ABORT + TRACK_OFF) -- the pulse in flight is cut and \
tracking goes off; the result text says the mount is NOT tracking any more and how to restore it. Review \
fixes (d2024bb): a calibration step whose later pulse fails counts the guide-ms of its completed pulses, so \
the abort's return equals what was sent (a sent-then-failed pulse is named in a WARNING, not returned); a \
calibrated guide nudge/screen step is capped at the MEASURED guide rate (response x plate scale), the seed \
only without one. A 0.4.1-shaped mount (no guide capability) keeps \
S6.8a's explicit refusal; Terrestrial is unchanged (angular, tracking OFF). Field incident 07d37da6's rule \
holds for guide-pulse nudges too: they move with no camera frame at all."""
