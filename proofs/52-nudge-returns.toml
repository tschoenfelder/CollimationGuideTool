# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 52-nudge-returns
issues = [52, 43]
summary = """USER DECISION (2026-10-10) + AGENTS.md manual-move rule: a RA/Dec nudge was gated on a \
stability-verified BEFORE capture and held the panel busy through a verified AFTER capture, so \
the controls stayed disabled long after the mount had stopped. Now the nudge is sized and sent \
at once, returns when the move completes, and #43's no-motion check runs afterwards in the \
background on fresh verified frames (BEFORE = the last verified at-rest reference, else the \
move is reported unchecked); it only adds a WARNING when a camera saw no image motion. A new \
move / Stop / mode change abandons a running check. Review C1: the check only READS the mount's tracking (no start/stop_tracking -- an abandoned check used to be able to send one while the next move ran); review C2: a tracking problem that stops the check is a WARNING in _last_error with nudge wording."""
modules = [
    "apps/collimation_tool/ui/mount_test_move_panel.py",
    "apps/collimation_tool/application/mount_align_positioning.py",
    "apps/collimation_tool/application/mount_align_plan.py",
]
