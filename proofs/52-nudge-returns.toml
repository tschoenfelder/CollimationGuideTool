tests/collimation/ui/test_mount_align_nudge_returns.py \
tests/collimation/ui/test_calibration_frame_validity.py::TestNoMotionIsExplicit::test_a_nudge_that_moved_nothing_is_not_a_confirmed_displacement \
tests/collimation/application/test_mount_align_interface.py tests/collimation/ui/test_collimation_main_window.py::TestTrackingMode::test_a_nudge_moves_and_its_check_reports_tracking_that_cannot_be_established"""
broader_tier = "component"
