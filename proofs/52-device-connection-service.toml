# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 52-device-connection-service
issues = [52]
summary = """S6.2 (#52 audit K01-K03): device connect/disconnect handling was written five \
times and the copies disagreed -- GuideTool caught only ConnectionError and never released the \
previous camera (the #45 ERROR_BUSY class); FilterWheelPanel neither logged a connect failure \
nor kept it for diagnostics (the ca5bb92 class); CameraPanel's stream start called \
camera.connect() unguarded; a failing first status read, focuser abort or tracking-off on quit \
(OnStepAdapter#17) raised out of the panel and skipped the release of the shared OnStep \
connection; MainWindow.closeEvent stopped panels without isolation; OnStepConnection.acquire \
closed the client only for (ConnectionError, RuntimeError, TimeoutError, ValueError), missing \
OnStepAdapter's KeyError and a socket.gaierror (OSError). One owner now: \
astrotool_core.session.device_connection -- LIFECYCLE_FAILURES (any Exception) split into \
device failures (WARNING) and INTERNAL_ERRORS (AttributeError/TypeError/NameError/\
AssertionError/ImportError: ERROR, "Internal error" wording, `internal` in diagnostics, and \
handed to sys.excepthook so the #10 incident capture still writes a bundle as when they \
escaped); one log record per failure with its traceback; phases \
CONNECT/START/WAIT/CANCEL/DISCONNECT/SHUTDOWN; all-or-nothing open with guaranteed release; \
close/stop_each that never raise or skip; switch_device = release previous, open + verify \
candidate, restore the previous through the same all-or-nothing open with its own identity \
check. Focuser, MountPark, FilterWheel and Camera panels, the GuideTool and closeEvent bind to \
it; acquire() closes the client on any failure. A static contract scans apps/ for re-stated \
failure wording and apps/+packages/ for a connect() guarded by handlers that do not cover \
Exception. Tooling (same change): scripts/prove.py batches the `pytest --collect-only` node ids \
(the single command line had reached ~32,000 of Windows' 32,767 characters). Placed in \
astrotool_core (not collimation_tool.application) because the GuideTool needs the same failure \
set and switch order."""
