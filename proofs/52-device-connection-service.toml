tests/core/testing/test_prove.py::TestCollectBatching"""
broader_tier = "component"
field_only_assumptions = [
    "That every rig port's disconnect() is harmless after a failed or partial connect() is taken from the port contracts and the adapters' code (OnStep shims guard with _held, IndiFilterWheelAdapter closes its client unconditionally, TouptekCameraAdapter abandons a half-open handle) -- the all-or-nothing release after a failed START/WAIT has not run on the real EFW/ToupTek/OnStep yet.",
    "A real OnStepAdapter#17 unconfirmed emergency stop on quit is only simulated (stop_confirms=False); the real driver path ends in the same RuntimeError per mount_park_adapter.py:143.",
]
gaps = [
    "MountTestMovePanel's connect handler still has its own copy of the K01 pattern (mount_test_move_panel.py, outside the S6.2 contract; pinned in tests/contracts/test_connection_failure_contract.py::_ALLOWED_WORDING until S6.6 binds it to DeviceConnectionService). RESOLVED in S6.6b: the panel uses DeviceConnectionService and the pin is gone (proofs/52-mount-align-owners.toml).",
    "mount_pulse_adapter.py:138 still restates the OnStep operation exception tuple (K02 adapter side, not in the S6.2 contract) and focuser_adapter.py converts only ValueError (L02 reachability) -- S6.3/S6.6.",
    "Panel status polls after connect (periodic status() raising) stay unguarded -- operation/poll lifecycle is S6.3.",
    "The S6.4 P-a 500 ms re-enforce timer stays in MainWindow (coordinator decision): mode/tracking policy that must tick whether or not any panel's connection is open (S6.4 tests unchanged).",
    "The internal-error routing tests failed pre-S6.2 because the exception escaped the handler (then sys.excepthook captured it in the real app); they pin that the contained path still reaches the hook -- the review probe against the first S6.2 draft (swallowed: 1 WARNING, no traceback, 0 hook calls, no bundle) has no separate committed state.",
    "The wording scan covers apps/ only: in packages/ the phrases are the adapters' own exception messages (the device's reason), reported by the owner.",
]

