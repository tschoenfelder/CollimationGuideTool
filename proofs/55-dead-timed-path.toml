summary = """S6.8d (movement-paths R9/F9/F11/R11/F13, audit P04/P05): the timed motion path was alive only \
through fakes that accept timed pulses -- the production OnStep adapter has none. Deleted from Mount \
Align and recenter (D3/D4/D5: _pulse_with_retry, the timed fallback, MOTION_TIMED*, the timed bootstrap \
learn_rate -> install_rate, park_after re-park, the len(step) > 3 tracking-gate shape check), and the \
adapter's unused install_rate/installed_rate; pulse_axis stays only because MountPort still declares it \
for the dormant GuideTool. The fakes moved to the production contract. Settings pulse_ms, rate_preset, \
calibration_rate_preset and max_nudge_pulse_ms are removed; an old config.toml keeps loading (each key \
ignored with one warning naming it; install.md migration note). The nudge cap is the explicit angle \
max_nudge_arcsec, default numerically equal to the former derived cap. The Astronomical axis-move \
refusal names its real cause (OnStepAdapter >= 0.5.0 needed / tracking came on before the send / during \
an axis-move calibration) instead of 'not available yet'; stale texts fixed; rearm_after_stop uses a \
typed StopLatch port; boundary token list extended and an import-linter contract limits \
astrotool_core.indi.client to the filter wheel + testing. Deletion proven neutral by a differential \
characterization (production adapters over the fake OnStep INDI client / #51 simulator; Terrestrial \
angular + Astronomical guide-pulse calibration, nudges, screen moves, 0.4.1 refusals, angular and \
guide-pulse reacquisition): byte-identical labels, diagnostics and mount commands after the deletion \
commit; afterwards only the intended texts differ, plus the uncalibrated nudge's diagnostics no longer \
carry rate_preset "7" (a preset that never moved the mount) -- the key leaves the movement context and \
with it stability.<cam> and timeline[].cameras.<cam> (CommandedMovementContext.as_dict drops None). \
Review fixes: astrotool_core.indi no longer re-exports the client (the contract forbids the whole \
package), AngularMotionPort lost install_rate/installed_rate, and a panel test pins calibration=True."""
