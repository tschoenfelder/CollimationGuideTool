# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 55-single-source-defaults
issues = [55, 47]
summary = """S6.1 (#55 D01-D03): the EFW device name, the INDI endpoint and the config file \
locations each had several authoritative copies, two of them live contradictions -- the \
FakeIndiServer simulated the known-wrong 'ToupTek EFW 1' and IndiFilterWheelAdapter defaulted \
to a third name 'Filter Wheel'; the filter wheel dialled 'localhost' while OnStep dialled \
'127.0.0.1' (same indiserver; 'localhost' costs ~2 s per connect on Windows against an \
IPv4-only listener). One owner each now: astrotool_core.config.device_defaults \
(EFW_DEVICE_NAME, INDI_HOST=127.0.0.1, INDI_PORT=7624) and astrotool_core.config.paths (both \
config files and the diagnostics dir). Every reader resolves its default location through \
own_config_path()/smarttscope_config_path()/diagnostics_dir() at call time; the old per-module \
DEFAULT_* names stay as compatibility aliases bound to fixed real locations \
(paths.DEFAULT_*), so they never capture a redirected value. Deviation from the audit's \
suggested owners (filter_wheel/config.py for the EFW name, a new indi_endpoint.py): one \
stdlib-only leaf in astrotool_core.config is importable by indi/client.py, the adapter and \
the simulators without pulling in filter_wheel; filter_wheel/config.py keeps owning which \
config source wins. A static contract test (packages/, apps/, scripts/; substring matching \
incl. host:port strings, URLs, f-string parts, port as int/float/string) rejects any \
re-stated literal; tests/conftest.py's isolation collapsed to one patch per owner location \
(both config files and the diagnostics dir)."""
