# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 55-capability-tables
issues = [55]
summary = """S6.5 (#55 audit C01/C02/D04): unsupported-capability handling was ad hoc. Camera: \
TouptekCameraAdapter had two mechanisms for one concept (hand-written flag-gated _supports_* \
properties plus a temperature-only E_NOTIMPL cache), get_descriptor() -- read on every frame -- \
re-queried the gain/exposure/TEC ranges per call, and a flag-gated option the SDK still refused \
(E_NOTIMPL) warned on every use: the 531a952/4730c55 spam class, still open for every call but the \
two fixed ones. Now one capability table (_FEATURE_FLAGS + _OPTION_FEATURE, flag names looked up \
on the SDK module via the S6.5a _SDK_FALLBACKS/_sdk_constant single source) decides each feature \
once per connection: flag-gated features from model.flag, the temperature sensor by one probe at \
connect, ranges asked once at connect (a transiently failed gain/exposure range is re-asked at \
most once per range_retry_s on the injected clock); the first E_NOTIMPL for a feature or option is \
recorded and reported once (INFO), never re-asked; get_descriptor() makes no other SDK call; \
CameraCapabilities gains supports_temperature and supports_raw16. Safety: the cooler's on/off and \
its target are separate features, and every TEC-off write (connect, cooling off, disconnect) is \
gated by the TEC flags only -- a refused target never suppresses it (a review finding on the \
pre-commit S6.5 tree, which left the cooler ON). Mount: MountCapabilities gains \
supports_angular_moves and min/max_angular_arcsec (OnStepMountPulseAdapter reports OnStepAdapter's \
own MIN_AXIS_MOVE_ARCSEC/MAX_AXIS_MOVE_DEG; min_angular_arcsec kept as a deprecated alias), and \
MountStatus gains fresh (held-over readings marked, S6.0c leftover). D04: the -10 C cooling \
target default has one owner, config.camera_settings.DEFAULT_TARGET_TEMPERATURE_C, read at call \
time by the settings dataclass/loader, the camera panel and the adapter; the config-source \
contract test scans for re-statements and proves an injected default reaches every consumer."""
modules = [
    "packages/astrotool_core/camera/touptek_adapter.py",
    "packages/astrotool_core/camera/capabilities.py",
    "packages/astrotool_core/config/camera_settings.py",
    "packages/astrotool_core/mount/port.py",
    "packages/astrotool_core/onstep/mount_pulse_adapter.py",
    "packages/astrotool_core/testing/fake_mount.py",
    "packages/astrotool_core/testing/sim_touptek.py",
    "apps/collimation_tool/ui/camera_panel.py",
]
fix_commits = ["5f38a4c"]
dataset_uuids = []
focused_command = """pytest -q \
tests/core/camera/test_touptek_capability_table.py \
tests/core/camera/test_touptek_adapter_simulated.py::TestCapabilityMatrix \
tests/core/camera/test_touptek_adapter_simulated.py::TestUnsupportedCapabilityIsNeverCalled \
tests/core/onstep/test_mount_capabilities.py \
tests/core/onstep/test_onstep_adapters.py::TestHeldOverMountStatusIsMarked \
tests/contracts/test_mount_contract.py::test_declared_angular_capability_matches_the_mount \
tests/contracts/test_config_source_contract.py"""
broader_tier = "component"
field_only_assumptions = [
    "Gain, exposure and TEC-target ranges are asked once per connect instead of on every get_descriptor() call (a transiently failed gain/exposure query is re-asked at most every 30 s); assumed static for one connection on the real SDK (the simulator models them static). If a real camera's range changed with conversion gain or bit depth mid-session, the descriptor would now report the connect-time range.",
    "TEC-off safety on the rig (ATR585M): Cooling off and Disconnect must leave the cooler off; check the Temp reading drifts back toward ambient after Disconnect.",
    "The temperature sensor is probed once at connect (one get_Temperature call): on the GPCMOS02000KPA this is the one E_NOTIMPL the 4730c55 fix already allowed, now at connect instead of on the first poll; one INFO line 'temperature not implemented by this camera' per connect is expected in the Pi log, no WARNING.",
    "After the change, a Pi session with G3M678M/ATR585M/GPCMOS02000KPA should show no repeated 'SDK call failed' WARNING; any E_NOTIMPL the flags did not predict appears once as INFO '<feature> not implemented by this camera (SDK E_NOTIMPL)' -- read it to correct the flag inferences (S6.5a/S6.5b flag log).",
]
gaps = [
    "TOUPCAM_FLAG_GETTEMPERATURE (toupcam.py:30) is not used to gate the temperature sensor: the rig cameras' real flag words are unknown (S6.5b flag log pending), and a camera that reports a temperature without the bit would lose a working reading; the connect-time probe is used instead.",
    "Callers still duck-type: recenter_policy.py:353/:405 and mount_test_move_panel.py (getattr min_angular_arcsec, three hasattr 'angular' probes, hasattr abort), mount_test_move_runner.py:166, mount_park_panel.py (confirm_home/long_running_actions/home_confirmed), focuser_panel.py (blockers) -- migration to capabilities() recorded for S6.6; the deprecated alias keeps them working.",
    "D04 pinned exceptions: fake_camera.py:57, replay_camera.py:67, testing/fake_touptek.py:83 still re-state -10.0 (outside S6.5's allowed files); test_every_cooling_exception_is_still_needed forces deleting the pins once migrated. The camera panel's +/-40 C target-range fallback (camera_panel.py:288,373-374) is not centralized either.",
    "FocuserStatus has no held-over flag yet (focuser/port.py outside S6.5's files); OnStepFocuserAdapter's held-over readings stay display-only by convention.",
    "Simulator modelling (S6.5 additions, sim_touptek.py): query log and fail_calls fault injection are test seams; the flag/SDK disagreement (TEC flag set, TEC options E_NOTIMPL) is synthetic -- no rig camera is known to do it.",
]

