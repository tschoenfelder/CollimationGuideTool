    "MountTestMoveRunner keeps its own busy/outcome lifecycle (6b0a215, already guaranteed) -- its contract here was waits/retry only; adopting OperationLifecycle there is S6.6/S6.8.",
    "Stop events are not yet WIRED into the TrackingEnforcer callers (Mount Align capture worker, mount_test_move_panel) or into a FineCollimationController/FovCalibrator wait -- the seams exist (enforce/verify/ensure_tracking_mode cancel=), the callers are S6.6.",
