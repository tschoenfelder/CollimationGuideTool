    "OnStepAdapter's focuser move_absolute blocks until the target is reached (simulator semantics, sim_onstep.py), so the stricter autofocus move-settle costs no wait on the rig; a driver reporting a position different from both start and target still counts as arrived. Not yet observed on the real OnStep focuser.",
    "libindi answers an out-of-range FILTER_SLOT with Alert and a fresh vector (indifilterinterface.cpp per the simulator docstring); the rig's ToupTek EFW driver is unverified. The panel only offers slots the wheel reports, so the Alert path is reachable mainly programmatically.",
    "After Stop with park_after=True the runner no longer sends the re-park (a park is motion); production Mount Align always passes park_after=False, so no field behaviour changes there.",
    "OnStep's delayed auto-tracking after UNPARK (if it still exists behind OnStepAdapter 0.5.0's confirmed TRACK_OFF) could re-enable tracking right after a Stop that followed an unpark; the panel's Stop sends OnStep's emergency stop (abort + TRACK_OFF), but a TRACK_ON landing after it is not re-checked by the runner.",
    "Stop decisions (accepted by the coordinator, S6.3 review): after Stop no unpark/stop_tracking is sent from the fresh-park wait and no re-park is sent -- the mount may be left unparked with tracking off (the panel's emergency stop).",
    "MountParkPanel runs the #44 tracking enforcement only after a CONFIRMED unpark (not after the 30 s safety net); mitigated by OnStepAdapter 0.5.0's own TRACK_OFF on unpark.",
    "The real indiserver-drop path (IndiClient._mark_disconnected from the reader thread) is modelled by SimulatedIndiClient.drop_connection; not exercised against a real dropped indiserver.",
]
