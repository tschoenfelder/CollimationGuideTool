# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 52-operation-lifecycle
issues = [52, 53]
summary = """S6.3 (#52 audit L01/L02/L04/T01b/K02, #53 leftovers, S4/S6.2/S6.4 adapter findings): \
AutofocusRunner, FineCollimationRunner and FovCalibrator (3 entry points) had no try/finally -- one \
exception left is_busy True until restart (L02); MountParkPanel still had the pre-3fc09ae `elif`, so a \
park/unpark that never reached its target kept Park/Unpark disabled forever (L01); FocuserPanel's poll \
comment contradicted its is_moving gating (L01); panel status polls raised into Qt (L04); the autofocus \
search treated a not-yet-Busy focuser as settled and measured at the old position (T01b); Stop did not \
end a wait in progress (MountTestMoveRunner fresh-park/unpark/gate/retry/settle/re-park -- a rejected \
pulse was re-sent after Stop --, the tracking settle poll, the autofocus exposure settle and \
move-settle); IndiFilterWheelAdapter reported a cached Busy forever after indiserver dropped, hid an \
out-of-range slot's Alert, left its client open when the post-connect probe raised and throttled \
refreshes on time.monotonic; mount_pulse_adapter restated the OnStep exception tuple three times and \
OnStepFocuserAdapter converted only ValueError (K02, which made L02 reachable from an INDI \
TimeoutError); StreamController's cadence wait was an Event.wait on the real clock. Fix: one small \
application helper, collimation_tool.application.operation_lifecycle -- OperationLifecycle (one \
operation at a time, guaranteed terminal state succeeded/failed/cancelled + published outcome, Stop \
event), completion_verdict (seen-Busy-then-idle or safety-net timeout, timeout checked whatever the \
reading) and StatusPollGuard (poll never raises, logged once per streak, internal errors to the #10 \
hook) -- used by the three runners and the three panels; every MountTestMoveRunner wait takes the Stop \
event and nothing further (no unpark, retry, re-park) is sent after Stop; ensure_tracking_mode / \
TrackingEnforcer.enforce/verify take a cancel event (unconfirmed -> REPAIR_FAILED, fail closed); the \
searcher's settle needs the move SEEN to finish and honours cancel; AutofocusController.run takes the \
runner's stop event for the exposure settle; ONSTEP_OPERATION_ERRORS is the one OnStep exception set \
(OSError, RuntimeError, ValueError, KeyError) used by the pulse and focuser shims; the filter-wheel \
adapter follows the client's connection, reports Alert in `reason` only once Busy was seen after the \
command or a 1 s grace (injected clock) passed -- a cached or refresh-re-announced old Alert is not a \
rejection --, closes on a raising probe and takes clock=/client_factory= (the simulator helper uses \
them); a raising on_error still yields a FAILED outcome; an autofocus move-settle timeout is logged \
once per search; StreamController takes clock= and the \
sleep-guard policy allowlist loses the filter-wheel entry."""
