# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 51-touptek-noframe
issues = [51]  # S6.5b has no GitHub issue; found by S6.5a under #51 (schema: [] needs a dataset uuid)
summary = """S6.5b (found by S6.5a): touptek_adapter._prepare_capture_mode put TOUPCAM_OPTION_NOFRAME_TIMEOUT = 1, \
but the SDK takes '0 => disable, positive value (>= NOFRAME_TIMEOUT_MIN) => timeout milliseconds' with \
TOUPCAM_NOFRAME_TIMEOUT_MIN = 500 in the vendored SDK 59.29030.20250722 (resources/touptek/toupcam.py:109, :682), so 1 is outside the documented range; the 1 is the INDI driver's \
(indi_toupbase) value, ported via smart_telescope's 'indi' setup profile. Fix: put 0 (disabled, the SDK default) -- \
the adapter's own deadline (exposure + timeout_extra_s) bounds every frame wait and _camera_event does not handle \
the SDK's NOFRAMETIMEOUT event. Also one INFO line per connect with model name, raw model.flag (hex) and the \
derived mono/colour, USB3-capable, USB3-over-USB2-link and TEC classification, so the rig cameras' real flag bits become known."""
modules = ["packages/astrotool_core/camera/touptek_adapter.py"]
fix_commits = ["973d0ab"]
dataset_uuids = []
focused_command = """pytest -q \
tests/core/camera/test_touptek_adapter_simulated.py::TestNoFrameTimeoutIsAValidSdkValue \
tests/core/camera/test_touptek_adapter_simulated.py::TestConnectLogsTheModelFlagWord \
tests/core/camera/test_touptek_adapter_simulated.py::TestAdapterConstantsComeFromTheVendoredSdk \
tests/core/camera/test_touptek_adapter_simulated.py::TestSimulatorMatchesTheVendoredSdk"""
broader_tier = "component"
field_only_assumptions = [
    "What the real SDK did with the old value 1 is unknown: refused (a 'SDK call failed' WARNING at every connect, timeout stays disabled -- then this fix changes nothing on the rig) or accepted/clamped (NOFRAMETIMEOUT events that _camera_event ignored). Either way frame waits were bounded by the adapter's own deadline, before and after.",
    "Read the new 'TouptekCameraAdapter(...): opened model=... model.flag=0x... -> mono|colour, USB3-capable=..., USB3-over-USB2-link=..., TEC=...' INFO line for G3M678M, ATR585M and GPCMOS02000KPA on the next Pi run; it confirms or corrects S6.5a's inferences (MONO bit on G3M678M/ATR585M, USB30 bits from the family names) and the simulator's CAMERA_MODELS flag words.",
    "After the fix no 'SDK call failed' WARNING should follow camera connect on the Pi.",
    "Watch whether the still-open GPCMOS02000KPA 'camera busy' / calibration timeout (2026-09-24 field session) behaves differently after this change: if the real SDK had accepted the old 1, NOFRAMETIMEOUT events would have fired during multi-second trigger waits.",
]
gaps = [
    "Simulator modelling assumptions (none documented by the SDK): an out-of-range value is refused rather than clamped, with E_INVALIDARG, negative values included, and the option keeps its previous value. Older ToupTek headers may have documented the option as '1 = enable, 0 = disable' (unverified); the out-of-range reading is from the vendored 2025 header.",
    "If a future change re-enables the SDK no-frame timeout, TOUPCAM_EVENT_NOFRAMETIMEOUT (0x82) must be handled in _camera_event (it is not today) and the period must exceed the longest exposure plus readout.",
]

