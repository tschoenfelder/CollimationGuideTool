# Proof manifest -- schema in proofs/README.md.
# Run: python scripts/prove.py 55-global-mount-stop
issues = [55, 49]
summary = """S6.8c-R5 (movement-paths F3/R5): a park slew had no in-app Stop -- MountParkPanel has no Stop \
button and Mount Align's Stop is enabled only while Mount Align itself is busy; the hand controller or a power \
cut were the only ways to stop a park. Now MainWindow has ONE always-visible "Stop mount" button, enabled \
exactly while the MountMotionExecutor has a motion in flight (park/unpark, Mount Align, reacquisition -- every \
workflow claims the one executor), driven by a new additive executor in-flight listener marshalled to the GUI \
thread with a Qt signal. It calls the executor's new, additive abort_in_flight(): abort() with no owner, but the \
"is anything in flight" decision is taken under the executor lock, so a motion ending at the click never turns \
it into an idle emergency stop (which would also turn tracking off); it never waits on operation_lock. \
OnStepMountPulseAdapter.abort() (the executor's mount) now sends its lock-free stop through the SHARED \
OnStepConnection's live client whoever holds it -- before, only while the pulse adapter itself held the \
connection (Mount Align connected), so a park started from the Mount panel alone got no stop at all. Latch, \
stop worker, generation coverage and disconnect ordering are unchanged (S6.0c). A park/unpark whose claim the \
Stop cancelled reads "stopped by the user", not "failed", and keeps OnStepAdapter's own error text ("Park \
stopped by the user -- OnStepAdapter: ..."). OnStepAdapter 0.5.0's park() has no cancel hook: after the ABORT \
its status wait never sees the parked state and returns unconfirmed only at its own timeout (120 s) or on a \
status fault (indi_home.py:78-96, 111-133, 196-226); the Mount panel keeps its claim (Stop stays enabled, other \
motion refused busy) until park() returns."""
modules = [
    "apps/collimation_tool/ui/main_window.py",
    "apps/collimation_tool/ui/mount_park_panel.py",
    "apps/collimation_tool/application/mount_motion.py",
    "packages/astrotool_core/onstep/mount_pulse_adapter.py",
]
fix_commits = ["ff6754e", "f00007f", "9eb03dd"]
dataset_uuids = []
focused_command = "pytest -q tests/collimation/ui/test_main_window_global_mount_stop.py tests/collimation/application/test_mount_motion.py::TestInFlightListener tests/collimation/application/test_mount_motion.py::TestAbortInFlight tests/core/onstep/test_onstep_adapters.py::TestStopThroughTheSharedConnection"
broader_tier = "component"
field_only_assumptions = [
    "A real park slew stops on OnStep's TELESCOPE_ABORT_MOTION (stop_mount_via_indi, indi_stop.py:22-50) sent while OnStepAdapter's park() still waits in its status loop -- the simulator models only that the stop reaches the controller while the park call blocks.",
    "After that ABORT, OnStepAdapter's park() returns unconfirmed only after its 120 s status wait (or at once if OnStep flags park_failed/a fault): the Mount panel shows 'park stopped by the user -- waiting for OnStepAdapter to end the command' and the executor stays busy that long on the rig.",
]
gaps = [
    "EXTERNAL REQUIREMENT, filed 2026-10-23 as https://github.com/tschoenfelder/OnStepAdapter/issues/26: IndiMount.park() / IndiHomeRouter.park() has no cancel hook (indi_home.py:78-96; _move_to_position :111-133 blocks in _wait_status :196-226, timeout=120.0). After the app's ABORT the mount stops, but park() keeps blocking -- holding operation_lock -- until its 120 s timeout (or a park_failed/fault status) and returns unconfirmed. Needed: a cancellable park (a cancel event, or return at once when a concurrent ABORT is seen). Until then the executor stays busy (Stop enabled, other motion refused) for up to 120 s after a stopped park.",
    "Quit during a stopped park (same external limitation): closeEvent aborts first (lock-free), but the Mount panel's stop() then runs stop_tracking() under operation_lock on the GUI thread, behind OnStepAdapter's still-blocked, non-cancellable park() -- the GUI can block for up to 120 s on quit.",
    "By contract the global Stop is enabled only while the executor has a motion in flight: between Mount Align calibration steps (settle/capture, no claim) it is disabled; Mount Align's own Stop covers those gaps.",
    "With no live client on the shared connection a Stop sends nothing (nothing can be moving through this app then); the latch is still set.",
    "Revert-proof is at the 'no Stop button' / missing-API assertion for every new node (the button did not exist); the shared-connection stop, the idle guard, the atomic in-flight decision, the stopped text (with the error kept) and _stopped_by_user itself are mutation-proven on top (see evidence). Pre-fix line numbers re-run 2026-10-21 with 9eb03dd's tests and the four production files checked out at 8ef922a.",
]

