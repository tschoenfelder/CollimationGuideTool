# Proof manifest -- schema in proofs/README.md. Run: python scripts/prove.py 55-one-mount-motion-executor
issues = [55, 31, 46, 44, 49]
summary = """S6.8a (movement-paths F1/F2/F5/F7/F8/F12; R3/R1/R4/R8): two production movement \
executors with different safety envelopes, and Mount Align sent OnStep's EMERGENCY stop \
(stop_tracking = ABORT + TRACK_OFF) before every move whatever the mode -- an Astronomical screen \
move silently left the mount not tracking. Now one MountMotionExecutor (application/mount_motion.py, \
owned by MainWindow) serves Mount Align, guide-assisted reacquisition (angular + guide pulse) and \
park/unpark: one in-flight motion app-wide (busy refusal with a reason), Stop-latch re-arm on an \
accepted claim, a lock-free abort (fine-collimation Cancel scoped to reacquisition; quit aborts a \
motion in flight before any panel disconnects), interruptible settle, and the tracking rule \
(TrackingEnforcer.axis_move_gate): an axis move on a tracking mount is refused, never \
emergency-stopped -- Astronomical with an explicit message until guide-pulse Mount Align (S6.8b). \
The runner's automatic unpark now runs #44's unpark enforcement (F12). Review fixes: a Terrestrial move refused because tracking came back on gets the enforcer's tracking-off repair once (trail entry + operator note; a failed repair is refused with a recovery hint), an owner-scoped abort is atomic with claim/re-arm, and allowed axis-move gates no longer flood the evidence trail."""
modules = [
    "apps/collimation_tool/application/mount_motion.py",
    "apps/collimation_tool/ui/mount_test_move_runner.py",
