    "Mount Align motion has not run on the rig since 0.4.0: that OnStepAdapter 0.5.0's unpark() leaves tracking off (so Terrestrial moves are not refused after an automatic unpark) is proven on the fake/simulated client only.",
    "Superseded by S6.8b (proofs/31-astro-guide-pulse-mount-align.toml): Astronomical Mount Align now moves with guide pulses while tracking; the refusal remains only for a mount without OnStepAdapter 0.5.0 guide pulses.",
]
gaps = [
    "The end-to-end Cancel test drives MainWindow's reacquirer synchronously and presses the panel's Cancel from inside the simulated GOTO; it does not run the FineCollimationRunner thread.",
    "Revert-proof nodes that fail ONLY at import/construction before the fix: every test_mount_motion.py node except TestOwnerScopedAbortRace and the trail node (ImportError at module import vs c577fd4), test_mount_test_move_runner.py::TestOneMotionInFlightAppWide (ModuleNotFoundError, an ImportError: no mount_motion module) and test_main_window_motion_executor.py::test_fine_collimation_cancel_calls_the_abort_hook (TypeError: no abort_motion parameter). Each behaviour also has an assertion-level node here.",
    "abort()/clear_abort() remain a duck-typed probe (one owner: mount_motion.mount_abort / mount_commands.rearm_after_stop): MountCapabilities is frozen and has no Stop-latch field.",
    "Park via the Mount panel can now be stopped by Mount Align's Stop (executor abort reaches the shared pulse adapter), but there is still no Stop button that is enabled during a park (S6.8c R5).",
