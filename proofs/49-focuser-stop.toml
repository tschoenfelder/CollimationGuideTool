# Proof manifest -- schema in proofs/README.md.
# Run: python scripts/prove.py 49-focuser-stop
issues = [49, 55]
summary = """S6.8c-R7 (movement-paths F6): OnStepFocuserAdapter held operation_lock around OnStepAdapter's \
blocking IndiFocuser.move_absolute (up to 30 s) and stop() took the same lock, so the focuser Stop ran only \
after the move it should stop had ended; the In/Out jog ran that blocking move on the GUI thread. Fix (the \
S6.0c pattern): stop() takes no operation_lock -- it refuses every move requested up to then that is not yet \
in flight and hands OnStepAdapter's concurrent-safe IndiFocuser.stop() (sets _cancel_requested without the \
motion lock, indi_focuser.py:137-139; the move polls it, :107-108) to a short-lived worker, re-stopping a \
covered move still in flight; disconnect() waits (bounded) for that worker so quit never closes the client \
under it; blockers() never queues behind a move. FocuserPanel runs the jog on an OperationLifecycle worker \
and keeps In/Out/Auto Focus disabled while it runs."""
modules = [
    "packages/astrotool_core/onstep/focuser_adapter.py",
    "apps/collimation_tool/ui/focuser_panel.py",
]
fix_commits = ["e028cc5"]
dataset_uuids = []
focused_command = "pytest -q tests/core/onstep/test_focuser_stop_during_move.py tests/collimation/ui/test_focuser_panel_simulated.py::TestJogRunsOffTheGuiThread tests/collimation/application/test_autofocus_stop_during_move.py"
broader_tier = "component"
field_only_assumptions = [
    "The real lx200_OnStep driver honours INDI FOCUS_ABORT_MOTION during a running focuser move (stops short at once) -- OnStepAdapter relies on it (indi_focuser.py:145); the simulator models it.",
    "The interrupted IndiFocuser.move_absolute notices the cancel within one 0.5 s poll and then spends up to 5 s in its own stop confirmation (indi_focuser.py:107-114, 130-135); In/Out stay disabled for that time.",
    "Two passes of OnStepAdapter's 5 s stop confirmation (12 s bound in disconnect) cover a quit on the Pi.",
]
gaps = [
    "A Stop that interrupts an autofocus move ends the run as MOVE_REJECTED ('the focuser rejected the commanded move'), not CANCELLED: BoundedFocusSearcher._move_to checks the cancel flag only between moves (autofocus_search.py, outside this step's files). Before S6.8c the run ended CANCELLED, but only after the move had finished, followed by a return-to-best move after the Stop.",
    "IndiFocuser.move_absolute clears _cancel_requested on entry (indi_focuser.py:84): a Stop landing between the adapter's in-flight mark and that clear is caught only by the worker's second pass (after the first stop's up-to-5 s confirmation). No deterministic test drives that window.",
    "The simulator's interrupted move ends at once; OnStepAdapter's own exit-path stop wait (indi_focuser.py:130-135) is not modelled, so 'In/Out stay disabled while the jog worker is still ending' has no test.",
    "get_position()/get_max_position() still take operation_lock; their only callers are the autofocus worker, not the GUI thread.",
    "A focuser jog still queues (on its worker) behind a running mount GOTO -- the panel stays responsive and Stop refuses the queued jog, but the shared-connection serialization itself is unchanged (9cea2e9).",
]

