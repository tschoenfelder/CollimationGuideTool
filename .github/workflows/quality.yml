name: Quality gauntlet

# Server-side mirror of `scripts/check.sh --release` / `scripts/check.ps1
# -Release` (see CONTRIBUTING.md, "Before pushing a release"). Runs the full
# release gate on every push/PR so the rules are machine-enforced rather than
# convention-enforced (relates to #3).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        # PySide6 dynamically links EGL/xcb system libraries even under
        # QT_QPA_PLATFORM=offscreen — ubuntu-latest doesn't have them by
        # default, so every UI test module fails to import at collection
        # time (ImportError: libEGL.so.1). Mirrors the analogous
        # libxcb-cursor0 gap install.md documents for real Pi hardware.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libdbus-1-3

      - name: Install project + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff (includes C90 complexity gate)
        run: ruff check .

      - name: mypy
        run: mypy .

      - name: import-linter
        run: lint-imports

      - name: pytest — full release gate
        run: >
          pytest tests/core tests/collimation tests/guide tests/contracts
          tests/integration tests/acceptance
          --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Complexity/coverage hotspot report (informational, issue #4)
        run: python scripts/quality_report.py

      - name: Upload hotspot report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-hotspots
          path: docs/quality/hotspots.json
