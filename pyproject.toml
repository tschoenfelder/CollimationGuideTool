[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-tools"
version = "0.1.0"
description = "CollimationTool and GuideTool: shared astrotool_core plus two PySide6 desktop apps."
requires-python = ">=3.13"
authors = [{name = "Torsten Schoenfelder"}]
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",
    "PySide6>=6.7",
    # OnStepAdapter 0.6.11 merged into main (OnStepAdapter#36): its wheel ships onstep_mock and
    # onstep_adapter.capture, which the OnStep connection modes need (onstep/backend.py); it
    # refuses an RA-axis move after connecting or at HOME until DEC has moved, has the
    # hold-to-move jog (jog_ra/jog_dec) behind the Mount Align RA/Dec buttons, allows finite
    # axis moves up to 15 degrees, and a positive DEC-axis move follows OnStep's mechanical jog
    # direction (it lowers the published sky DEC). 0.6.12 (OnStepAdapter#37): a finite axis move
    # holds the other axis's hour angle (the goto target RA includes the sidereal drift since
    # the reading) and turns tracking off as soon as the slew is seen. 0.6.13 (OnStepAdapter#38):
    # finite axis moves no longer use a goto -- only the requested axis is driven, with OnStep's
    # single-axis motion, so a Dec move never turns the RA motor. 0.6.14 (OnStepAdapter#39):
    # mount.reconnect_device() reopens the INDI driver's link when OnStep stops answering.
    # 0.7.11 (OnStepAdapter#28): guarded astronomical/terrestrial mode arbitration; inactive
    # here (no `[terrestrial] state_file` in the config), so the calls this app makes are unchanged.
    # 0.7.12 (OnStepAdapter#40): reconnect_device() accepts a driver that reconnects by itself.
    # 0.7.13 (#41): a short OnStep Status gap after stop commands is a wait, not an ABORT.
    # 0.7.14 (#42): single-axis moves may use the fastest slew rates (1/5/20 degree steps).
    # 0.7.15 (#43): coarse steps stop at the target on an accelerating mount (live stop).
    # 0.7.16 (#44): connect() connects an OnStep INDI device left disconnected (indiserver restart).
    # 0.7.17 (#45): finite moves stop on target from the live position; up to 45 deg in one move.
    # 0.7.18 (#46): DEC moves never run past the DEC bound (measured direction, braking-aware).
    # 0.7.19 (#47): Small steps land in one pass (speed-up model, braking learned per speed).
    # 0.7.20 (#48): 250 ms driver polling while a move runs; moves land within 0.5 %.
    # 0.7.21 (#49): a move OnStep stops at a limit ends at once; the move back is allowed.
    # 0.7.22 (#50): quicker small steps (1.5 %), RA defined right after unpark (DEC first at pole).
    # 0.7.23 (#51): a 1 deg step in ~3 s (0.06 deg small-step tolerance, rest from one reading).
    # 0.7.24 (#52): a single late reading no longer ends a step mid-coast.
    # 0.7.25 (#53): close enough (6 %, max 0.5 deg) needs no second move; learning fix.
    # 0.7.27 (#55): fix the aim-factor update so it converges to the measured gain.
    "onstep-adapter @ git+https://github.com/tschoenfelder/OnStepAdapter.git@cc8c3612675d9373268853d1aaf243828426eb18",
    "smarttscope-live-analysis @ git+https://github.com/tschoenfelder/SmartTScopeLiveAnalysis.git@v0.1.0",
]

[project.urls]
Homepage = "https://github.com/tschoenfelder/CollimationGuideTool"

[project.optional-dependencies]
# The ToupTek SDK isn't pip-installable (no public wheel) — it's installed
# via scripts/setup_touptek_pi.sh instead, which copies resources/touptek/
# toupcam.py plus a libtoupcam.so (not committed — see that script's
# header) into the venv's site-packages. This extra is left as a documented
# placeholder in case a real wheel ever becomes available.
touptek = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.15",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "radon>=6.0",
    "cosmic-ray>=8.7",
]

[project.scripts]
collimation-tool = "collimation_tool.main:main"
guide-tool = "guide_tool.main:main"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["astrotool_core*", "collimation_tool*", "guide_tool*"]

[tool.pytest.ini_options]
# A hanging test dumps every thread's stack after 10 min (a full run once hung for 9 h).
faulthandler_timeout = 600
testpaths = ["tests"]
# No global coverage (issue #50): a targeted run must not measure the whole
# repository. Coverage runs in the release gate (`scripts/check.ps1 -Release`
# / `check.sh --release`) and CI's coverage job via `--cov`, which reads
# [tool.coverage.run] source and [tool.coverage.report] fail_under below.
# Every test gets exactly one tier marker from its path (tests/conftest.py,
# tier_for); see CONTRIBUTING.md "Test pyramid and the risk-based minimum gate".
markers = [
    "unit: pure/near-pure deterministic code; no Qt event loop, threads, sleeps, hardware, INDI, network",
    "component: one production component with fakes for its boundaries (fake clock where timing matters)",
    "contract: adapter/port conformance against deterministic fakes or the installed library API",
    "integration: several production components wired together, or real-data replays; no hardware",
    "acceptance: small below-UI product workflow set",
    "hardware: real devices; skipped unless --run-hardware or ASTROTOOL_RUN_HARDWARE=1",
]

[tool.coverage.run]
# coverage.py's default tracer (CTracer, a C-level sys.settrace hook) has
# a real thread-safety bug under Python 3.13 that reliably segfaults this
# suite: two apparently unrelated crashes (Qt's QApplication.processEvents
# on Windows in test_live_view.py; numpy/threading in
# test_guide_controller.py's background threads on Linux) both vanished
# entirely once traced with "sysmon" (Python 3.12+'s sys.monitoring API)
# instead — verified locally across multiple consecutive runs where the
# default core crashed close to every time with --cov active. Neither
# crash touched code this project owns; only the tracer changed.
core = "sysmon"
source = ["packages/astrotool_core", "apps/collimation_tool", "apps/guide_tool"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
# resources/touptek/toupcam.py is ToupTek's own vendored SDK wrapper
# (ctypes bindings), not this project's code — never linted/reformatted.
extend-exclude = ["resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
# resources/touptek/toupcam.py is ToupTek's own vendored SDK wrapper
# (ctypes bindings), not this project's code — never type-checked.
exclude = ["^resources/"]

[tool.importlinter]
root_packages = ["astrotool_core", "collimation_tool", "guide_tool"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core never imports the apps"
type = "forbidden"
source_modules = ["astrotool_core"]
forbidden_modules = ["collimation_tool", "guide_tool"]

[[tool.importlinter.contracts]]
name = "adapters never import a UI toolkit"
type = "forbidden"
source_modules = [
  "astrotool_core.camera.touptek_adapter",
  "astrotool_core.onstep",
  "astrotool_core.indi.client",
]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "timing (#53) is a leaf: no UI toolkit, no apps, no other core package"
type = "forbidden"
source_modules = ["astrotool_core.timing"]
# Every other astrotool_core package, listed explicitly: a new core package
# must be added here too (tests/core/testing/test_no_policy_sleep.py checks).
forbidden_modules = [
  "PySide6",
  "collimation_tool",
  "guide_tool",
  "astrotool_core.acquisition",
  "astrotool_core.camera",
  "astrotool_core.config",
  "astrotool_core.diagnostics",
  "astrotool_core.diffraction",
  "astrotool_core.filter_wheel",
  "astrotool_core.focus",
  "astrotool_core.frames",
  "astrotool_core.indi",
  "astrotool_core.mount",
  "astrotool_core.onstep",
  "astrotool_core.optics",
  "astrotool_core.registration",
  "astrotool_core.session",
  "astrotool_core.target",
  "astrotool_core.testing",
]

[[tool.importlinter.contracts]]
name = "roi_tracker never touches the mount"
type = "forbidden"
source_modules = ["astrotool_core.target.roi_tracker"]
forbidden_modules = ["astrotool_core.mount"]

[[tool.importlinter.contracts]]
name = "the generic INDI client serves only the filter wheel (S6.8d, R11; never the OnStep device)"
type = "forbidden"
source_modules = ["astrotool_core", "collimation_tool", "guide_tool"]
forbidden_modules = ["astrotool_core.indi"]
ignore_imports = [
  "astrotool_core.filter_wheel.* -> astrotool_core.indi.client",
  "astrotool_core.indi.client -> astrotool_core.indi._protocol",
  "astrotool_core.testing.* -> astrotool_core.indi.client",
  "astrotool_core.testing.* -> astrotool_core.indi._protocol",
]

[[tool.importlinter.contracts]]
name = "OnStepAdapter is the only route to the OnStep controller (AGENTS.md)"
type = "forbidden"
source_modules = ["astrotool_core", "collimation_tool", "guide_tool"]
forbidden_modules = ["onstep_adapter", "serial"]
ignore_imports = [
  "astrotool_core.onstep.* -> onstep_adapter",
  "astrotool_core.testing.fake_onstep_indi_client -> onstep_adapter",
]

[[tool.importlinter.contracts]]
name = "only the OnStep connection modes start the OnStepX mock (onstep/backend.py)"
type = "forbidden"
source_modules = ["astrotool_core", "collimation_tool", "guide_tool"]
forbidden_modules = ["onstep_mock"]
ignore_imports = ["astrotool_core.onstep.backend -> onstep_mock"]
