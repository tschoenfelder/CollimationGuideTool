[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-tools"
version = "0.1.0"
description = "CollimationTool and GuideTool: shared astrotool_core plus two PySide6 desktop apps."
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",
    "PySide6>=6.7",
    "onstep-adapter @ https://github.com/tschoenfelder/OnStepAdapter/releases/download/v0.5.0/onstep_adapter-0.5.0-py3-none-any.whl",
    "smarttscope-live-analysis @ git+https://github.com/tschoenfelder/SmartTScopeLiveAnalysis.git@v0.1.0",
]

[project.optional-dependencies]
# The ToupTek SDK isn't pip-installable (no public wheel) — it's installed
# via scripts/setup_touptek_pi.sh instead, which copies resources/touptek/
# toupcam.py plus a libtoupcam.so (not committed — see that script's
# header) into the venv's site-packages. This extra is left as a documented
# placeholder in case a real wheel ever becomes available.
touptek = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.15",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "radon>=6.0",
    "cosmic-ray>=8.7",
]

[project.scripts]
collimation-tool = "collimation_tool.main:main"
guide-tool = "guide_tool.main:main"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["astrotool_core*", "collimation_tool*", "guide_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No global coverage (issue #50): a targeted run must not measure the whole
# repository. Coverage runs in the release gate (`scripts/check.ps1 -Release`
# / `check.sh --release`) and CI's coverage job via `--cov`, which reads
# [tool.coverage.run] source and [tool.coverage.report] fail_under below.
# Every test gets exactly one tier marker from its path (tests/conftest.py,
# tier_for); see CONTRIBUTING.md "Test pyramid and the risk-based minimum gate".
markers = [
    "unit: pure/near-pure deterministic code; no Qt event loop, threads, sleeps, hardware, INDI, network",
    "component: one production component with fakes for its boundaries (fake clock where timing matters)",
    "contract: adapter/port conformance against deterministic fakes or the installed library API",
    "integration: several production components wired together, or real-data replays; no hardware",
    "acceptance: small below-UI product workflow set",
    "hardware: real devices; skipped unless --run-hardware or ASTROTOOL_RUN_HARDWARE=1",
]

[tool.coverage.run]
# coverage.py's default tracer (CTracer, a C-level sys.settrace hook) has
# a real thread-safety bug under Python 3.13 that reliably segfaults this
# suite: two apparently unrelated crashes (Qt's QApplication.processEvents
# on Windows in test_live_view.py; numpy/threading in
# test_guide_controller.py's background threads on Linux) both vanished
# entirely once traced with "sysmon" (Python 3.12+'s sys.monitoring API)
# instead — verified locally across multiple consecutive runs where the
# default core crashed close to every time with --cov active. Neither
# crash touched code this project owns; only the tracer changed.
core = "sysmon"
source = ["packages/astrotool_core", "apps/collimation_tool", "apps/guide_tool"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
# resources/touptek/toupcam.py is ToupTek's own vendored SDK wrapper
# (ctypes bindings), not this project's code — never linted/reformatted.
extend-exclude = ["resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
# resources/touptek/toupcam.py is ToupTek's own vendored SDK wrapper
# (ctypes bindings), not this project's code — never type-checked.
exclude = ["^resources/"]

[tool.importlinter]
root_packages = ["astrotool_core", "collimation_tool", "guide_tool"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core never imports the apps"
type = "forbidden"
source_modules = ["astrotool_core"]
forbidden_modules = ["collimation_tool", "guide_tool"]

[[tool.importlinter.contracts]]
name = "adapters never import a UI toolkit"
type = "forbidden"
source_modules = [
  "astrotool_core.camera.touptek_adapter",
  "astrotool_core.onstep",
  "astrotool_core.indi.client",
]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "timing (#53) is a leaf: no UI toolkit, no apps, no other core package"
type = "forbidden"
source_modules = ["astrotool_core.timing"]
# Every other astrotool_core package, listed explicitly: a new core package
# must be added here too (tests/core/testing/test_no_policy_sleep.py checks).
forbidden_modules = [
  "PySide6",
  "collimation_tool",
  "guide_tool",
  "astrotool_core.acquisition",
  "astrotool_core.camera",
  "astrotool_core.config",
  "astrotool_core.diagnostics",
  "astrotool_core.diffraction",
  "astrotool_core.filter_wheel",
  "astrotool_core.focus",
  "astrotool_core.frames",
  "astrotool_core.indi",
  "astrotool_core.mount",
  "astrotool_core.onstep",
  "astrotool_core.optics",
  "astrotool_core.registration",
  "astrotool_core.session",
  "astrotool_core.target",
  "astrotool_core.testing",
]

[[tool.importlinter.contracts]]
name = "roi_tracker never touches the mount"
type = "forbidden"
source_modules = ["astrotool_core.target.roi_tracker"]
forbidden_modules = ["astrotool_core.mount"]

[[tool.importlinter.contracts]]
name = "OnStepAdapter is the only route to the OnStep controller (AGENTS.md)"
type = "forbidden"
source_modules = ["astrotool_core", "collimation_tool", "guide_tool"]
forbidden_modules = ["onstep_adapter", "serial"]
ignore_imports = [
  "astrotool_core.onstep.* -> onstep_adapter",
  "astrotool_core.testing.fake_onstep_indi_client -> onstep_adapter",
]
